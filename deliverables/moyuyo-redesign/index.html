<!DOCTYPE html>
<html lang="zh-CN" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOYUYO ATELIER · 五 Tab 可交互原型</title>
<link rel="stylesheet" href="assets/lucide.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app" id="app">

  <!-- ============ 评审面板 ============ -->
  <aside class="panel" id="panel">
    <div class="panel__head">
      <div class="panel__brand">
        <span class="panel__mark">MOYUYO</span>
        <span class="panel__sub">ATELIER · 五 Tab 可交互原型</span>
      </div>
      <button class="panel__fold" data-act="panel-fold" aria-label="展开或收起面板">
        <span class="luc luc-chevron-down"></span>
      </button>
    </div>

    <div class="panel__body" id="panelBody">

      <section class="ctl">
        <h2 class="ctl__label">主题</h2>
        <div class="seg" role="group" aria-label="主题">
          <button class="seg__btn is-on" data-act="theme" data-arg="light">浅色</button>
          <button class="seg__btn" data-act="theme" data-arg="dark">深色</button>
          <button class="seg__btn" data-act="theme" data-arg="auto">跟随系统</button>
        </div>
      </section>

      <section class="ctl">
        <h2 class="ctl__label">尺寸</h2>
        <div class="seg" role="group" aria-label="尺寸">
          <button class="seg__btn is-on" data-act="size" data-arg="390">390 × 844</button>
          <button class="seg__btn" data-act="size" data-arg="430">430 × 932</button>
          <button class="seg__btn" data-act="size" data-arg="375">375 × 667</button>
        </div>
      </section>

      <section class="ctl">
        <h2 class="ctl__label">状态<em>一次点击整页切换，不刷新</em></h2>
        <div class="seg seg--wrap" role="group" aria-label="页面状态">
          <button class="seg__btn is-on" data-act="status" data-arg="normal">正常</button>
          <button class="seg__btn" data-act="status" data-arg="loading">加载</button>
          <button class="seg__btn" data-act="status" data-arg="empty">空</button>
          <button class="seg__btn" data-act="status" data-arg="error">错误</button>
          <button class="seg__btn" data-act="status" data-arg="guest">未登录</button>
          <button class="seg__btn" data-act="status" data-arg="stale">弱网</button>
        </div>
      </section>

      <section class="ctl">
        <h2 class="ctl__label">标注</h2>
        <button class="switch" data-act="hotspot" role="switch" aria-checked="false">
          <span class="switch__track"><span class="switch__knob"></span></span>
          <span class="switch__text">显示可点热区（88 × 88rpx）</span>
        </button>
      </section>

      <section class="ctl ctl--now">
        <h2 class="ctl__label">当前页面</h2>
        <div class="now">
          <span class="now__tab" id="nowTab">Pet</span>
          <span class="now__meta" id="nowMeta">正常 · 390 × 844</span>
        </div>
        <button class="btn btn--sec btn--sm" data-act="reset">
          <span class="luc luc-rotate-ccw"></span> 重置原型
        </button>
      </section>

      <p class="panel__note">
        交互真实现：Tab 切换 · 页内 Tab 下划线 · 点赞 · 左滑删除 · 下拉刷新 · 骨架屏 · Pet 四联动 · 消息未读链路 · 6 态切换 · 主题切换。
        列表可拖动（鼠标按住 = 手指）。
      </p>
    </div>
  </aside>

  <!-- ============ 舞台 ============ -->
  <main class="stage" id="stage">
    <div class="phone" id="phone" data-size="390">
      <div class="phone__status" id="statusbar" aria-hidden="true">
        <span class="phone__time">9:41</span>
        <span class="phone__sys">
          <span class="luc luc-signal"></span>
          <span class="luc luc-wifi"></span>
          <span class="luc luc-battery-full"></span>
        </span>
      </div>
      <div class="phone__screen" id="screen" role="main"></div>
      <nav class="phone__tabbar" id="tabbar" role="tablist" aria-label="主导航"></nav>
      <div class="phone__layers" id="layers"></div>
    </div>
  </main>

</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>

/**
 * 根构建脚本
 */
buildscript {
  ext {
    compileSdkVersion = 34
    minSdkVersion = 24
    targetSdkVersion = 34
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath 'com.android.tools.build:gradle:8.2.0'
    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
  }
}

// 依赖仓库统一在 settings.gradle 的 dependencyResolutionManagement 中声明：
// 本项目启用了 RepositoriesMode.FAIL_ON_PROJECT_REPOS，若在 allprojects 里再声明会直接构建失败

tasks.register('clean', Delete) {
  delete rootProject.layout.buildDirectory
}

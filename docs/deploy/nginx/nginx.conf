user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
# 官方 nginx 镜像只有 /var/run（软链到 /run），没有 /var/run/nginx 目录，
# pid 必须写成 /var/run/nginx.pid，否则启动即报 open() "/var/run/nginx/pid" failed
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 100;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # API 限流
    limit_req_zone $binary_remote_addr zone=moyuyo_api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=moyuyo_login:10m rate=10r/s;

    server_tokens off;

    # ============================================================
    # MOYUYO H5 站点 + Spring Boot 反代（同源部署，避免 CORS）
    # 重要：/api/v1/* 与 /uploads/* 必须反代到后端 8080
    #
    # X-Forwarded-For 安全约束：必须用 $remote_addr「覆盖」而不能用
    # $proxy_add_x_forwarded_for「追加」。追加会把客户端自带的 XFF 保留在最前面，
    # 后端 ClientIpResolver 取首段作为客户端 IP，攻击者可伪造 IP 绕过 IP 限流 / 污染审计日志。
    # 若前置还有 CDN，需改用 ngx_http_realip_module：
    #   set_real_ip_from <CDN 回源网段>;  real_ip_header X-Forwarded-For;  real_ip_recursive on;
    # ============================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # H5 静态文件目录（vite build 后产物）
        root /www/moyuyo/dist;
        index index.html;

        # H5 router (history 模式)兜底
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        # 私信 WebSocket 反代：/ws/dm?ticket=xxx
        # 注意：必须显式声明 Upgrade/Connection 与 HTTP/1.1，否则握手会被降级成普通 HTTP 请求；
        # proxy_read_timeout 必须大于客户端心跳间隔（25s），否则空闲连接会被 Nginx 提前掐断
        location /ws/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            # WebSocket 长连接不参与 HTTP 限流（按 IP 限流会误伤运营商 NAT 下的移动端用户）
            proxy_buffering off;
        }

        # 后端 API 反代：必须保留 Upgrade/Connection 头以便 WebSocket/SSE
        location /api/v1/ {
            limit_req zone=moyuyo_api burst=200 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
        }

        # 用户上传文件反代（图片/视频，大文件下载同样放宽超时）
        location /uploads/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            # 大文件边收边发，避免 Nginx 整包缓冲到临时磁盘
            proxy_buffering off;
        }

        # 3D 模型静态资源反代（后端 classpath:/static/models/ 下的 .glb / .fbx）
        # APP 首次进入 3D 空间会从这里下载模型（约 26MB + 30MB + 30MB），落地后走沙盒缓存
        #
        # 注意：只反代 /static/models/ 子路径，不能写成 /static/。
        # /static/icons、/static/pet、/static/draco 等是 H5 构建产物（Vite 从 src/static 拷贝），
        # 整段反代到后端会让页面图标、Draco 解码器全部 404。
        location /static/models/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 模型是 26~30MB 的二进制文件：默认 proxy_read_timeout 60s 在弱网/移动网络下
            # 可能等不到下一段数据就先断开，客户端会看到一个"下载到一半失败"。
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            # 不整包缓冲，直接流式转发给客户端（省内存、首字节更快）
            proxy_buffering off;

            # 后端未返回 Content-Type 时的兜底（.glb / .fbx 都是二进制）
            default_type application/octet-stream;

            # 模型更新频率低，长缓存。注意：同名文件换内容会吃满 365 天缓存，
            # 换版本请换文件名（如 home-v2.glb）或 URL 加 ?v=2。
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 登录限流更严
        location /api/v1/auth/login {
            limit_req zone=moyuyo_login burst=20 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}

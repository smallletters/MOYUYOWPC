user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx/pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 100;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # API 限流
    limit_req_zone $binary_remote_addr zone=moyuyo_api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=moyuyo_login:10m rate=10r/s;

    server_tokens off;

    # ============================================================
    # MOYUYO H5 站点 + Spring Boot 反代（同源部署，避免 CORS）
    # 重要：/api/v1/* 与 /uploads/* 必须反代到后端 8080
    # ============================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # H5 静态文件目录（vite build 后产物）
        root /www/moyuyo/dist;
        index index.html;

        # H5 router (history 模式)兜底
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        # 后端 API 反代：必须保留 Upgrade/Connection 头以便 WebSocket/SSE
        location /api/v1/ {
            limit_req zone=moyuyo_api burst=200 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
        }

        # 用户上传文件反代
        location /uploads/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3D 模型静态资源反代（后端 classpath:/static/models/ 下的 .glb）
        # APP 端首次进入 3D 空间会从此处下载模型,首次落地后由 uni-app 沙盒缓存
        # .glb 是二进制 glTF,MIME 用 model/gltf-binary,缺失时浏览器会下载失败
        location ~* ^/static/models/.*\.glb$ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            types {
                application/octet-stream glb;
            }
            # 模型更新频率低,设一年长缓存。版本切换通过文件名变更完成(老文件可继续保留)
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 登录限流更严
        location /api/v1/auth/login {
            limit_req zone=moyuyo_login burst=20 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}

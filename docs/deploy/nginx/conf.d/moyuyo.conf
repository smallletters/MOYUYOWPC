# 限流配置（conf.d 自包含定义，即使主 nginx.conf 未包含也可正常工作）
limit_req_zone $binary_remote_addr zone=moyuyo_api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=moyuyo_login:10m rate=10r/s;

server {
    listen 80;
    # 与 443 保持同一组域名，否则 http://api.moyuyoshop.com 不会命中此块、无法跳到 HTTPS
    server_name api.moyuyoshop.com api.moyuyo.com;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    # 生产实际域名是 moyuyoshop.com；保留旧域名兼容历史解析
    # 注意：ssl_certificate 必须包含上述所有域名，否则 HTTPS 会证书不匹配
    server_name api.moyuyoshop.com api.moyuyo.com;

    ssl_certificate /etc/nginx/ssl/api.moyuyo.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.moyuyo.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    client_max_body_size 50m;

    # X-Forwarded-For 必须用 $remote_addr 覆盖（不能用 $proxy_add_x_forwarded_for 追加），
    # 否则客户端可自带伪造 XFF 首段，绕过后端 IP 限流并污染审计/风控 IP 字段。
    # 若前置还有 CDN，改用 ngx_http_realip_module 的 set_real_ip_from + real_ip_header。

    location / {
        proxy_pass http://moyuyo-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_buffer_size 4k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;

        limit_req zone=moyuyo_api burst=200 nodelay;
    }

    # 登录/注册/找回密码等未鉴权敏感端点：独立收紧限流，防止账号爆破与短信轰炸
    # 原配置写成 /api/auth/login，与真实路径 /api/v1/auth/* 不符，导致该限流从未生效
    location ~ ^/api/v1/auth/(login|register|password/forgot|password/reset|email/verify|phone/send-code)$ {
        proxy_pass http://moyuyo-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=moyuyo_login burst=20 nodelay;
    }

    location /actuator/health {
        proxy_pass http://moyuyo-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        internal;
    }

    # 3D 模型静态资源：.glb / .fbx 单个 26~30MB，弱网下载会远超默认 60s 读超时，
    # 不单独放宽的话客户端会在传输中途被 Nginx 掐断（表现为"下载到一半失败"）。
    location /static/models/ {
        proxy_pass http://moyuyo-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 边收边发，不整包缓冲到临时磁盘
        proxy_buffering off;

        # 后端缺 Content-Type 时的二进制兜底
        default_type application/octet-stream;

        # 长缓存：换模型请换文件名（Home-v2.glb）或 URL 加 ?v=2，否则同名文件会吃满一年缓存
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其它后端静态资源（Draco 解码器 / 站点图标等）：大文件超时同样放宽
    location /static/ {
        proxy_pass http://moyuyo-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 用户上传文件（图片/视频，可能包含后台新增的 3D 模型）
    location /uploads/ {
        proxy_pass http://moyuyo-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://moyuyo-backend:8080;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /error/404.html;
    error_page 500 502 503 504 /error/50x.html;

    location = /error/404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /error/50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

server {
    listen 80;
    server_name www.moyuyo.com moyuyo.com;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name www.moyuyo.com moyuyo.com;

    ssl_certificate /etc/nginx/ssl/www.moyuyo.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/www.moyuyo.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html index.htm;

    try_files $uri $uri/ /index.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

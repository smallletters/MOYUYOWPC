# ============================================================
# 本地开发专用 compose（仅 dev 机器使用，不要提交到生产）
# 不与 docker-compose.yml 合并，单独使用：
#   docker compose --env-file .env -f docker-compose.dev-only.yml up -d --build
#
# 与 docker-compose.yml 的差异：
#   - 不启 elasticsearch / rocketmq / mysqld-exporter / redis-exporter / rocketmq-exporter
#   - dev profile（跳过 ProdConfigValidator）
#   - 关闭 MySQL TLS 校验
#   - Redis 端口避开本机原生 Redis 占用的 6379 → 容器 6379 → 宿主 6390
# ============================================================

services:
  mysql:
    image: mysql:8.0.36
    container_name: moyuyo-mysql
    restart: unless-stopped
    cpus: '2.0'
    mem_limit: 2G
    mem_reservation: 1G
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
      nproc: { soft: 8192, hard: 8192 }
    environment:
      # dev 环境用 root 连接：只设 MYSQL_ROOT_PASSWORD，不传 MYSQL_USER/PASSWORD（避免 MySQL 镜像拒绝 root user）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moyuyo_dev}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
      MYSQL_LONG_QUERY_TIME: '1'
      MYSQL_SLOW_QUERY_LOG: 'ON'
      MYSQL_LOG_SLOW_EXTRA: 'ON'
      MYSQL_MAX_CONNECTIONS: '200'
      MYSQL_INNODB_BUFFER_POOL_SIZE: '1G'
      MYSQL_INNODB_LOG_FILE_SIZE: '256M'
      MYSQL_WAIT_TIMEOUT: '7200'
      MYSQL_INTERACTIVE_TIMEOUT: '7200'
      MYSQL_INNODB_LOCK_WAIT_TIMEOUT: '10'
      MYSQL_INNODB_DEADLOCK_DETECT: 'ON'
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - moyuyo-mysql-logs:/var/log/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: moyuyo-redis
    restart: unless-stopped
    cpus: '1.0'
    mem_limit: 1280M
    mem_reservation: 512M
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      - "--maxclients"
      - "10000"
      - "--maxmemory"
      - "800mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--lazyfree-lazy-eviction"
      - "yes"
    environment:
      TZ: Asia/Shanghai
    # 宿主 6379 已被本机原生 Redis 占用 → 容器 6379 → 宿主 6390
    ports:
      - "127.0.0.1:6390:6379"
    volumes:
      - redis-data:/data
      - moyuyo-redis-logs:/var/log/redis
    healthcheck:
      # 直接展开密码（避免 shell 变量替换问题）：
      # 基础 compose 用 $${REDIS_PASSWORD} 转义让 compose 跳过该变量，由 shell 展开。
      # 但本容器 environment 没注入 REDIS_PASSWORD，所以 shell 拿到空串 → NOAUTH 失败。
      # 这里把密码明文展开进命令字符串，与 .env 文件保持同步即可（容器内仅本机访问）。
      test: ["CMD-SHELL", "redis-cli -a \"gmMdFR7QwCGVYal9n1HhyEzP\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: moyuyo-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 绑定到所有接口，让局域网其他设备也能访问（如 192.168.6.103:8080）
      # 前置 Nginx/反代时仅暴露 127.0.0.1，但 dev 联调需要局域网访问
      - "8080:8080"
      - "9090:9090"
    environment:
      # 关键：dev profile，跳过 ProdConfigValidator
      SPRING_PROFILES_ACTIVE: dev
      # 关闭 MySQL TLS 校验
      MYSQL_VERIFY_SERVER_CERTIFICATE: "false"
      MYSQL_TRUSTSTORE_URL: ""
      MYSQL_TRUSTSTORE_PASSWORD: ""
      # 跳过 ES / RocketMQ（占位 URL 避免 starter 校验失败，实际不连）
      ELASTICSEARCH_URIS: "http://127.0.0.1:9200"
      ELASTICSEARCH_SSL_ENABLED: "false"
      ELASTICSEARCH_SSL_CERT_VALIDATION: "false"
      ELASTICSEARCH_SSL_BUNDLE: ""
      # 引用 .env 里的强随机值（与 application-prod.yml 的 ES truststore 密码一致），
      # IDE 看到 ${VAR} 形式就不再报"hardcoded secret"；prod 启动时由 ProdConfigValidator 校验。
      ELASTICSEARCH_TRUSTSTORE_PASSWORD: "${ELASTICSEARCH_TRUSTSTORE_PASSWORD:-eawhPTLMYrJHNV5S}"
      # rocketmq-spring-boot-starter 强制校验 name-server 不能为空
      # dev 环境给一个本地不存在的地址，consumer 会连失败但不影响应用启动
      ROCKETMQ_NAMESRV_ADDR: "127.0.0.1:9876"
      ROCKETMQ_ENABLED: "false"
      # 容器内互联（通过 compose 网络）
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}"
      MYSQL_USER: "${MYSQL_USER:-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-moyuyo_dev}"
      # dev 跳过限流
      MOYUYO_IP_RATELIMIT_ENABLED: "false"
      MOYUYO_USER_RATELIMIT_ENABLED: "false"
      # JWT / API 签名密钥
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      API_SIGN_SECRET: "${API_SIGN_SECRET:-P4mZc8QsWvTkYxHjLnRd2AbXfGpV9yUo}"
      API_SIGNATURE_ENABLED: "${API_SIGNATURE_ENABLED:-false}"
      # CORS（dev 友好）
      MOYUYO_CORS_ALLOWED_ORIGINS: "${MOYUYO_CORS_ALLOWED_ORIGINS:?MOYUYO_CORS_ALLOWED_ORIGINS must be set}"
      # dev 管理员
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@moyuyo.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-moyuyo_Dev#2026!}"
      MOYUYO_SKIP_ADMIN_INIT: "true"
      # 支付渠道占位（dev 不真实支付）
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-sk_test_placeholder}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-placeholder}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-placeholder}"
      PAYPAL_WEBHOOK_ID: "${PAYPAL_WEBHOOK_ID:-placeholder}"
      PAYPAL_ALLOWED_ORIGINS: "${PAYPAL_ALLOWED_ORIGINS:-https://moyuyo.com,http://localhost:5174}"
      # WooCommerce 占位
      WOOCOMMERCE_URL: "${WOOCOMMERCE_URL:-http://localhost}"
      WOOCOMMERCE_CONSUMER_KEY: "${WOOCOMMERCE_CONSUMER_KEY:-ck_placeholder}"
      WOOCOMMERCE_CONSUMER_SECRET: "${WOOCOMMERCE_CONSUMER_SECRET:-cs_placeholder}"
      # JVM 内存
      JVM_XMS: "${JVM_XMS:-1g}"
      JVM_XMX: "${JVM_XMX:-2g}"
      # Spring mail 默认关闭（dev 走 log-only 降级）
      SPRING_MAIL_HOST: "${SPRING_MAIL_HOST:-127.0.0.1}"
      SPRING_MAIL_PORT: "${SPRING_MAIL_PORT:-1025}"
      SPRING_MAIL_USERNAME: "${SPRING_MAIL_USERNAME:-}"
      SPRING_MAIL_PASSWORD: "${SPRING_MAIL_PASSWORD:-}"
      SPRING_MAIL_SMTP_AUTH: "${SPRING_MAIL_SMTP_AUTH:-false}"
      SPRING_MAIL_SMTP_SSL: "${SPRING_MAIL_SMTP_SSL:-false}"
      SPRING_MAIL_SMTP_STARTTLS: "${SPRING_MAIL_SMTP_STARTTLS:-false}"
      MOYUYO_MAIL_FROM: "${MOYUYO_MAIL_FROM:-noreply@moyuyo.local}"
      MOYUYO_MAIL_FROM_NAME: "${MOYUYO_MAIL_FROM_NAME:-MOYUYO Support}"
      MOYUYO_MAIL_ENABLED: "${MOYUYO_MAIL_ENABLED:-false}"
      # 容器内 hostname
      HOSTNAME: moyuyo-server
      # 上传文件落盘目录：必须与下方 moyuyo-uploads 卷挂载目标保持一致，
      # 否则容器重建后用户上传的图片/视频会丢失（默认 /tmp 在容器可写层）
      MOYUYO_UPLOAD_DIR: ${MOYUYO_UPLOAD_DIR:-/app/uploads}
      # ---- 应用功能开关与第三方服务（与生产 compose 对齐，此前未透传）----
      # 默认值均取自 application-dev.yml / application.yml 的 dev 内置默认，
      # 未在 .env 中配置时行为与补齐前完全相同
      # 链路追踪采样率（dev 默认 1.0 = 全量采样）
      MOYUYO_TRACE_SAMPLE_RATE: "${MOYUYO_TRACE_SAMPLE_RATE:-1.0}"
      # BCrypt 强度（dev 默认 10，降低登录/注册耗时）
      MOYUYO_BCRYPT_STRENGTH: "${MOYUYO_BCRYPT_STRENGTH:-10}"
      # 审计日志（dev 默认：小队列 + 关闭保留期清理）
      MOYUYO_AUDIT_QUEUE_CAPACITY: "${MOYUYO_AUDIT_QUEUE_CAPACITY:-1000}"
      MOYUYO_AUDIT_BLOCK_ON_FULL: "${MOYUYO_AUDIT_BLOCK_ON_FULL:-false}"
      MOYUYO_AUDIT_RETENTION_ENABLED: "${MOYUYO_AUDIT_RETENTION_ENABLED:-false}"
      MOYUYO_AUDIT_RETENTION_DAYS: "${MOYUYO_AUDIT_RETENTION_DAYS:-90}"
      # WooCommerce 库存同步（dev 默认关闭，避免本机频繁调 WC）
      WC_STOCK_SYNC_ENABLED: "${WC_STOCK_SYNC_ENABLED:-false}"
      WC_STOCK_SYNC_CRON: "${WC_STOCK_SYNC_CRON:-0 */5 * * * *}"
      # OpenAPI 文档元数据（dev 默认邮箱见 application-dev.yml）
      OPENAPI_CONTACT_EMAIL: "${OPENAPI_CONTACT_EMAIL:-dev@moyuyo.local}"
      OPENAPI_VERSION: "${OPENAPI_VERSION:-1.0.0}"
      # 阿里云短信：MOYUYO_SMS_PROVIDER 留空时验证码仅打印日志（NoopSmsServiceImpl）
      MOYUYO_SMS_PROVIDER: "${MOYUYO_SMS_PROVIDER:-}"
      MOYUYO_SMS_ACCESS_KEY_ID: "${MOYUYO_SMS_ACCESS_KEY_ID:-}"
      MOYUYO_SMS_ACCESS_KEY_SECRET: "${MOYUYO_SMS_ACCESS_KEY_SECRET:-}"
      MOYUYO_SMS_SIGN_NAME: "${MOYUYO_SMS_SIGN_NAME:-MOYUYO}"
      MOYUYO_SMS_TEMPLATE_LOGIN: "${MOYUYO_SMS_TEMPLATE_LOGIN:-SMS_LOGIN_DEFAULT}"
      MOYUYO_SMS_TEMPLATE_REGISTER: "${MOYUYO_SMS_TEMPLATE_REGISTER:-SMS_REGISTER_DEFAULT}"
      MOYUYO_SMS_TEMPLATE_RESET: "${MOYUYO_SMS_TEMPLATE_RESET:-SMS_RESET_DEFAULT}"
      # 物流轨迹第三方 Provider（dev 默认 none；dev 内置 poll 间隔 30 分钟）
      MOYUYO_LOGISTICS_PROVIDER: "${MOYUYO_LOGISTICS_PROVIDER:-none}"
      MOYUYO_LOGISTICS_API_KEY: "${MOYUYO_LOGISTICS_API_KEY:-}"
      MOYUYO_LOGISTICS_CUSTOMER: "${MOYUYO_LOGISTICS_CUSTOMER:-}"
      MOYUYO_LOGISTICS_POLL_INTERVAL: "${MOYUYO_LOGISTICS_POLL_INTERVAL:-30}"
      MOYUYO_LOGISTICS_POLL_BATCH_SIZE: "${MOYUYO_LOGISTICS_POLL_BATCH_SIZE:-100}"
      # Google Maps 位置服务（留空时 /api/v1/geo/* 返回"地图服务未配置"）
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      # CSP 白名单：默认值与 SecurityHeadersFilter 的 @Value 默认一致，
      # 注意不能留空（空值会覆盖默认白名单，导致 CSP 头异常收紧）
      MOYUYO_SECURITY_CSP_CONNECT_SRC: "${MOYUYO_SECURITY_CSP_CONNECT_SRC:-https://api.stripe.com,https://api-m.paypal.com,https://*.sentry.io}"
      MOYUYO_SECURITY_CSP_IMG_SRC: "${MOYUYO_SECURITY_CSP_IMG_SRC:-data:,https://*.moyuyo.com,https://*.moyuyoshop.com,https://*.bloomwitness.com}"
      MOYUYO_SECURITY_CSP_FONT_SRC: "${MOYUYO_SECURITY_CSP_FONT_SRC:-data:}"
    volumes:
      - moyuyo-logs:/var/log/moyuyo
      - moyuyo-heapdump:/app/heapdump
      # 持久化用户/管理员上传文件，避免容器重建后图片、视频全部丢失
      - moyuyo-uploads:${MOYUYO_UPLOAD_DIR:-/app/uploads}
    cpus: '2.0'
    mem_limit: 4G
    mem_reservation: 1G
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
      nproc: { soft: 8192, hard: 8192 }
    pids_limit: 4096
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -m 5 http://127.0.0.1:9090/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  mysql-data:
  redis-data:
  moyuyo-logs:
  moyuyo-heapdump:
  # 上传文件持久卷：挂载到 app 容器的 MOYUYO_UPLOAD_DIR
  moyuyo-uploads:
  moyuyo-mysql-logs:
  moyuyo-redis-logs:
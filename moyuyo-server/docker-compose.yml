# Docker Compose V2 已弃用顶层 version 字段（自 2020 年 Docker Compose 1.28+），
# 写入会触发 `WARN: the attribute 'version' is obsolete` 告警，且不影响部署行为。
# 现已移除以保持仓库干净。

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0.36
    container_name: moyuyo-mysql
    restart: unless-stopped
    # 资源限制：避免 MySQL OOM 时拖垮宿主机
    # mem_limit: 硬上限（容器 OOM 后被 kill，但其他容器不受影响）
    # cpus: 限制 CPU 使用，避免慢查询占用全部 CPU
    # 注意：deploy.resources 仅在 swarm 模式生效，单机用 cpus / mem_limit 直接约束（需 Docker >= 19.03）
    cpus: '2.0'
    mem_limit: 2G
    mem_reservation: 1G
    # 限制文件描述符 / 进程数：防止异常连接耗尽 fd
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 8192
        hard: 8192
    environment:
      # root 密码与应用账号分离，避免业务连接使用 root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moyuyo_prod}
      MYSQL_USER: ${MYSQL_USER:-moyuyo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      # 显式声明容器内时区，避免容器时区与宿主机/JVM 不一致导致 NOW()/TIMESTAMP 漂移
      TZ: Asia/Shanghai
      # 慢查询阈值（秒）：超过即记录到慢日志，便于排查与索引优化
      # 设为 1s（覆盖大多数业务 SQL），高于该阈值的查询会被记录到 slow_query_log 便于排查
      # 注意：必须同时开启 slow_query_log=ON（默认 OFF），通过 MYSQL_SLOW_QUERY_LOG 控制
      MYSQL_LONG_QUERY_TIME: '1'
      # 开启慢查询日志：默认 OFF，生产环境必须 ON 才能采集到慢 SQL
      # 由监控侧的 mysqld-exporter + pt-query-digest 分析定位索引缺失
      MYSQL_SLOW_QUERY_LOG: 'ON'
      # log_slow_extra：开启扩展字段（锁时间、扫描行数等），便于深度分析（MySQL 8.0+）
      MYSQL_LOG_SLOW_EXTRA: 'ON'
      # 最大连接数：与 HikariCP maximum-pool-size * 实例数 + 预留 buffer 对齐
      # P1 优化：默认 151 在低规格服务器下偏高，按需调整
      # 多实例部署场景：max_connections >= N 实例 × 20 pool-size + DBA / Flyway / exporter 共用连接 ≈ 100
      # 设置过大会导致每个连接占用 ~5MB（sort_buffer + tmp_table + binlog cache），300 连接 ≈ 1.5GB 内存浪费
      MYSQL_MAX_CONNECTIONS: '200'
      # InnoDB buffer pool：约占 mem_limit 的 50-70%，留余量给连接/排序
      MYSQL_INNODB_BUFFER_POOL_SIZE: '1G'
      # InnoDB 日志文件大小：与 innodb_log_files_in_group 配合（默认 2 组共 96MB 偏小）
      MYSQL_INNODB_LOG_FILE_SIZE: '256M'
      # wait_timeout：MySQL 服务端空闲连接超时（默认 8h 即 28800s）
      # 必须大于 HikariCP max-lifetime=1800s，否则服务端先于客户端关闭连接，
      # 触发 "Communications link failure" 异常。设置为 7200s（2h）保留充足冗余。
      MYSQL_WAIT_TIMEOUT: '7200'
      # interactive_timeout：同上，作用于交互式连接（部分客户端会用交互模式）
      MYSQL_INTERACTIVE_TIMEOUT: '7200'
      # InnoDB 行锁等待超时：默认 50s 偏长，高并发下排队请求会阻塞 HikariCP 连接池
      # 收紧到 10s 让业务侧更快感知锁竞争（Fail-Fast 优于无限等待）
      # 由应用层 Connection.isValid() 捕获后走 GlobalExceptionHandler 统一返回 503
      MYSQL_INNODB_LOCK_WAIT_TIMEOUT: '10'
      # 死锁检测：MySQL 8 默认开启（innodb_deadlock_detect=ON），仅作显式声明便于审计
      MYSQL_INNODB_DEADLOCK_DETECT: 'ON'
    ports:
      # 仅绑定本机回环，避免数据库端口暴露公网
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 慢日志与错误日志挂载到命名卷，便于运维 tail / grep
      - moyuyo-mysql-logs:/var/log/mysql
    healthcheck:
      # 注意：在 docker-compose 中，"$$" 是字面 "$" 的转义，shell 中最终看到 "${MYSQL_ROOT_PASSWORD}"。
      # 这样密码值里的 $ 不会被 docker-compose 字符串替换器吞掉。
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # MySQL 证书信任库初始化
  # 背景：mysql:8.0 首次初始化时会在数据目录自动生成「自签 CA + 由其签发的服务端证书」，
  #       客户端要校验服务端证书，必须持有该自签 CA。
  # 做法：用带 keytool 的 JRE 镜像把 ca.pem 导入为 PKCS12 信任库，供 app 以 sslMode=VERIFY_CA 校验。
  #       ⚠️ 不能用 `openssl pkcs12 -export -nokeys` 导出：OpenSSL 生成的是 cert-only PKCS12
  #       （pbeWithSHA1And40BitRC2-CBC 证书袋），Java KeyStore 读出来条目数为 0，校验必然失败；
  #       MySQL 官方文档同样推荐用 keytool -importcert 导入 ca.pem。
  # 幂等性：每次 up 都重建信任库，保证 mysql-data 卷被重建（自签证书换新）后信任库同步更新
  mysql-certs-init:
    # 与 app 运行时同基础镜像（含 keytool），构建 app 镜像时该层已在本地缓存，无需额外拉大镜像
    image: eclipse-temurin:25-jre-alpine
    container_name: moyuyo-mysql-certs-init
    # 一次性任务，执行完即退出，不需要重启策略
    restart: "no"
    depends_on:
      mysql:
        # 必须等 MySQL 初始化完成（自签证书生成）后再导入，否则找不到 ca.pem
        condition: service_healthy
    environment:
      # 该值同时作为 PKCS12 信任库的密码，app 侧用同一变量解锁，两处必须一致
      MYSQL_TRUSTSTORE_PASSWORD: ${MYSQL_TRUSTSTORE_PASSWORD:?MYSQL_TRUSTSTORE_PASSWORD must be set}
    volumes:
      # 只读读取 MySQL 数据目录中的自签 CA（随 mysql-data 命名卷持久化）
      - mysql-data:/var/lib/mysql:ro
      # 输出信任库，供 app 只读挂载
      - mysql-certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      # 注意：compose 会把 "$" 当变量插值，shell 变量一律写成 "$$"（最终容器内为 "$"）
      - |
        set -e
        CA=/var/lib/mysql/ca.pem
        if [ ! -f "$$CA" ]; then
          echo "[mysql-certs] 未找到 MySQL CA：$$CA（MySQL 是否已完成初始化？）" >&2
          exit 1
        fi
        # keytool -importcert 遇到同名别名会报错，先删除旧文件实现幂等重建
        rm -f /certs/mysql-ca.p12
        # -storepass:env 从环境变量读密码，避免密码出现在容器进程命令行里
        keytool -importcert -noprompt \
          -alias moyuyo-mysql-ca \
          -file "$$CA" \
          -keystore /certs/mysql-ca.p12 \
          -storetype PKCS12 \
          -storepass:env MYSQL_TRUSTSTORE_PASSWORD
        chmod 644 /certs/mysql-ca.p12
        echo "[mysql-certs] 信任库已生成：/certs/mysql-ca.p12（alias=moyuyo-mysql-ca）"

  # Redis 缓存
  redis:
    image: redis:7.2-alpine
    container_name: moyuyo-redis
    restart: unless-stopped
    # 资源限制：Redis 单进程
    # P1 优化：mem_limit 必须 >= --maxmemory + Redis 自身开销（fork COW、AOF rewrite 等）
    # 原配置 mem_limit=1G 但 maxmemory=800m，剩余 200M 在 fork/rewrite 高峰时被宿主机 OOM-killer 杀掉
    # 调整后 mem_limit=1.2G 留出 25% buffer，与生产级 Redis 部署规范一致
    cpus: '1.0'
    mem_limit: 1280M
    mem_reservation: 512M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      # 限制最大客户端连接数：避免异常连接耗尽 fd
      - "--maxclients"
      - "10000"
      # 限制最大内存：超限后按 maxmemory-policy 淘汰，避免 OOM
      - "--maxmemory"
      - "800mb"
      # LRU 近似淘汰：相比 allkeys-lru 对冷数据更友好
      - "--maxmemory-policy"
      - "allkeys-lru"
      # 开启 lazy free：避免大 key 删除时阻塞主线程
      - "--lazyfree-lazy-eviction"
      - "yes"
    environment:
      # 容器时区与 JVM/宿主机一致，避免 EXPIRE 类 TTL 误差
      TZ: Asia/Shanghai
      # healthcheck 与日志脚本内通过 $REDIS_PASSWORD 引用密码（$$ 转义后容器内展开）
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      # 仅绑定本机回环，避免 Redis 端口暴露公网
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      # 持久化 AOF + RDB：即使容器重启也能恢复热点 key
      - moyuyo-redis-logs:/var/log/redis
    healthcheck:
      # 在 docker-compose 中 "$$" 是字面 "$" 的转义，shell 中最终看到 "${REDIS_PASSWORD}"，
      # 这样密码值里的 $、!、空格等不会被 docker-compose 字符串替换器吞掉。
      # --no-auth-warning 抑制每次执行时 redis-cli 的 AUTH warning（避免日志噪声）。
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Elasticsearch 证书初始化，仅首次启动时生成共享 PKCS12 证书
  es-certs-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: moyuyo-es-certs-init
    user: "0"
    command: >-
      bash -c 'set -e;
      if [ ! -f /usr/share/elasticsearch/config/certs/ca.p12 ]; then
      elasticsearch-certutil ca --silent --pass "${ELASTICSEARCH_TRUSTSTORE_PASSWORD}" --out /usr/share/elasticsearch/config/certs/ca.p12;
      fi;
      if [ ! -f /usr/share/elasticsearch/config/certs/elasticsearch.p12 ]; then
      elasticsearch-certutil cert --silent --name elasticsearch --dns elasticsearch,localhost --ca /usr/share/elasticsearch/config/certs/ca.p12 --ca-pass "${ELASTICSEARCH_TRUSTSTORE_PASSWORD}" --out /usr/share/elasticsearch/config/certs/elasticsearch.p12 --pass "${ELASTICSEARCH_TRUSTSTORE_PASSWORD}";
      fi;
      chown 1000:0 /usr/share/elasticsearch/config/certs/ca.p12 /usr/share/elasticsearch/config/certs/elasticsearch.p12;
      chmod 640 /usr/share/elasticsearch/config/certs/ca.p12 /usr/share/elasticsearch/config/certs/elasticsearch.p12'
    environment:
      ELASTICSEARCH_TRUSTSTORE_PASSWORD: ${ELASTICSEARCH_TRUSTSTORE_PASSWORD:?ELASTICSEARCH_TRUSTSTORE_PASSWORD must be set}
    volumes:
      - es-certs:/usr/share/elasticsearch/config/certs

  # Elasticsearch（生产环境启用 x-pack security + HTTPS）
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: moyuyo-elasticsearch
    restart: unless-stopped
    depends_on:
      es-certs-init:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Shanghai
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD must be set}
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.keystore.path: /usr/share/elasticsearch/config/certs/elasticsearch.p12
      xpack.security.http.ssl.keystore.password: ${ELASTICSEARCH_TRUSTSTORE_PASSWORD:?ELASTICSEARCH_TRUSTSTORE_PASSWORD must be set}
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.keystore.path: /usr/share/elasticsearch/config/certs/elasticsearch.p12
      xpack.security.transport.ssl.keystore.password: ${ELASTICSEARCH_TRUSTSTORE_PASSWORD:?ELASTICSEARCH_TRUSTSTORE_PASSWORD must be set}
      xpack.security.transport.ssl.truststore.path: /usr/share/elasticsearch/config/certs/elasticsearch.p12
      xpack.security.transport.ssl.truststore.password: ${ELASTICSEARCH_TRUSTSTORE_PASSWORD:?ELASTICSEARCH_TRUSTSTORE_PASSWORD must be set}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "true"
    # 资源限制：ES JVM 堆已固定 1g，加上 index buffer / file system cache / segment merging，
    # 实际进程常驻 ~2g；显式设 mem_limit=2g 给 OS 留 0.5g 余量，避免容器被宿主机 OOM-killer 杀掉
    # （Elasticsearch 默认 host 级别无上限，单次大查询即可撑爆 32g 内存）
    # cpus 限制 1.5：避免 ES 在 reload/merge 期间吃满宿主 CPU 拖慢 MySQL/Redis
    cpus: '1.5'
    mem_limit: 2G
    mem_reservation: 1G
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-certs:/usr/share/elasticsearch/config/certs
    ports:
      # 仅绑定本机回环，避免 ES 暴露公网
      - "127.0.0.1:9200:9200"
    healthcheck:
      # 注意：在 docker-compose 中，"$$" 是字面 "$" 的转义，shell 中最终看到 "${ELASTIC_PASSWORD}"。
      # 容器内密码环境变量名为 ELASTIC_PASSWORD（compose 已从 ELASTICSEARCH_PASSWORD 映射）
      test: ["CMD-SHELL", "curl -kfs -u elastic:\"$${ELASTIC_PASSWORD}\" https://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # RocketMQ Name Server
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: moyuyo-rocketmq-namesrv
    restart: unless-stopped
    # Name Server 本身内存占用很低（< 256MB），但仍显式限制防止异常路径
    cpus: '0.5'
    mem_limit: 512M
    mem_reservation: 128M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: ["sh", "mqnamesrv"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9876:9876"
    healthcheck:
      # 直接探测 9876 端口：mqadmin 为 JVM 工具，启动常超 5s 阈值导致误判 unhealthy；
      # Name Server boot success 即监听 9876，端口连通即可确认就绪
      # 注意：镜像默认 sh 为 dash，不支持 /dev/tcp，必须用 bash -c
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876 || exit 1'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: moyuyo-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    # 资源限制：RocketMQ broker 主要吃 PageCache（CommitLog 预分配），commitLog 默认 1G
    # 加 JVM + index + consume queue，进程常驻 ~2G；显式限制避免 broker 内存抖动拖垮宿主
    cpus: '1.5'
    mem_limit: 3G
    mem_reservation: 1G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      TZ: Asia/Shanghai
    command: >
      sh mqbroker
        -n rocketmq-namesrv:9876
        --enable-proxy false
        -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    ports:
      - "127.0.0.1:10909:10909"
      - "127.0.0.1:10911:10911"
    volumes:
      - rocketmq-data:/root/store
      - rocketmq-logs:/root/logs
    healthcheck:
      # 通过 broker 10911 端口连通性确认 broker 已真正就绪（而非仅进程存在）
      # 端口连通比进程检查更可靠：进程在但监听未就绪时也能被发现
      # 注意：镜像默认 sh 为 dash，不支持 /dev/tcp，必须用 bash -c
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10911 || exit 1'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 后端服务（多阶段构建：编译阶段使用 JDK 25，运行时仅保留 JRE）
  app:
    build:
      context: .
      # 启用 BuildKit 缓存挂载（需 docker buildx 或 DOCKER_BUILDKIT=1）
      # - maven:~/.m2 挂载为缓存：避免每次构建都全量下载依赖（CI 加速显著）
      # - 仅在构建阶段有效，不进入运行时镜像
      cache_from:
        - moyuyo-api:cache
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: moyuyo-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      # 依赖 MySQL 自签 CA 导出的信任库，必须等初始化容器成功退出后再启动应用
      mysql-certs-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    ports:
      # 业务端口：本机无前置 Nginx 时需监听 0.0.0.0 供局域网直连
      # （生产由 1Panel/Nginx 反代时建议改回 127.0.0.1）
      - "0.0.0.0:8080:8080"
      # P1 安全：actuator 端口独立绑定到 127.0.0.1:9090
      # 仅允许 Prometheus 与同主机监控进程访问，外部攻击面彻底关闭
      - "127.0.0.1:9090:9090"
    volumes:
      # 共享 ES 证书，使应用能验证 ES 自签证书
      - es-certs:/opt/es-certs:ro
      # MySQL CA 信任库：由 mysql-certs-init 从 MySQL 自签 CA（/var/lib/mysql/ca.pem）导出，
      # 应用据此以 sslMode=VERIFY_CA 校验服务端证书（路径与 MYSQL_TRUSTSTORE_URL 一致）
      - mysql-certs:/opt/mysql-certs:ro
      # 持久化应用日志，避免容器重建后丢失
      # Dockerfile 中 GC 日志 (-Xlog:gc*) 落到 /var/log/moyuyo/gc.log，
      # JFR 录制 (JFR_RECORDING=true 时) 落到 /var/log/moyuyo/jfr/，均覆盖在 moyuyo-logs 卷下
      - moyuyo-logs:/var/log/moyuyo
      # 持久化 OOM 堆转储文件：容器重建后仍可保留，便于事后根因分析
      - moyuyo-heapdump:/app/heapdump
      # 持久化用户/管理员上传文件：不挂卷时默认落到容器 /tmp（tmpfs），重启即全部丢失
      # 挂载目标必须与 MOYUYO_UPLOAD_DIR 一致，否则文件写入目录与 /uploads/** 静态映射目录不一致
      - moyuyo-uploads:${MOYUYO_UPLOAD_DIR:-/app/uploads}
    environment:
      # 默认 prod；本机联调可在 .env 设 SPRING_PROFILES_ACTIVE=dev（dev 跳过生产强校验、弱密码仅限本机）
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # logback 日志目录：容器根目录 read_only=true（安全加固），默认 ./logs(/app/logs) 不可写；
      # 强制指向已挂载的 moyuyo-logs 卷（/var/log/moyuyo，chown moyuyo:moyuyo）。
      # 透传 .env 中的 LOG_PATH，未设置时默认 /var/log/moyuyo
      LOG_PATH: ${LOG_PATH:-/var/log/moyuyo}
      # management.server.port：actuator 独立监听 9090 端口（与 compose 端口映射一致）。
      # prod 默认 9090；dev 必须显式指定（否则 actuator 落到 8080，
      # Dockerfile 的 HEALTHCHECK 探测 9090 持续 exit=7 失败，容器长期 unhealthy）。
      # 见 override.yml 文件说明注释
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-9090}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moyuyo_prod}
      MYSQL_USER: ${MYSQL_USER:-moyuyo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_VERIFY_SERVER_CERTIFICATE: ${MYSQL_VERIFY_SERVER_CERTIFICATE:?MYSQL_VERIFY_SERVER_CERTIFICATE must be set}
      MYSQL_TRUSTSTORE_URL: file:/opt/mysql-certs/mysql-ca.p12
      MYSQL_TRUSTSTORE_PASSWORD: ${MYSQL_TRUSTSTORE_PASSWORD:?MYSQL_TRUSTSTORE_PASSWORD must be set}
      # 显式声明缺省值时拒绝启动，禁止 truststore 使用弱口令
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      # 监控 exporter 独立密码：注入以通过 ProdConfigValidator 启动期"账号独立 + 必填"校验
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD must be set}
      REDIS_EXPORTER_PASSWORD: ${REDIS_EXPORTER_PASSWORD:?REDIS_EXPORTER_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      API_SIGN_SECRET: ${API_SIGN_SECRET:?API_SIGN_SECRET must be set}
      MOYUYO_CORS_ORIGINS: ${MOYUYO_CORS_ORIGINS:?MOYUYO_CORS_ORIGINS must be set}
      # Stripe（Google Pay / Apple Pay / Credit Card 通道）
      # 当前状态：待 Stripe Atlas 美国公司主体注册完成后回填；上线前必须为真实 sk_live_ 密钥
      # 此处用 :- 占位符避免 docker-compose 启动期硬阻断，应用启动后由 PaymentServiceImpl
      # 在支付调用时检测到占位符并返回 Mock URL（保证结算页 UI 可演示）
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:?PAYPAL_CLIENT_ID must be set}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:?PAYPAL_CLIENT_SECRET must be set}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:?PAYPAL_WEBHOOK_ID must be set}
      PAYPAL_ALLOWED_ORIGINS: ${PAYPAL_ALLOWED_ORIGINS:?PAYPAL_ALLOWED_ORIGINS must be set}
      ELASTICSEARCH_URIS: ${ELASTICSEARCH_URIS:?ELASTICSEARCH_URIS must be set}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_SSL_ENABLED: ${ELASTICSEARCH_SSL_ENABLED:-true}
      ELASTICSEARCH_SSL_CERT_VALIDATION: ${ELASTICSEARCH_SSL_CERT_VALIDATION:-true}
      ELASTICSEARCH_SSL_BUNDLE: ${ELASTICSEARCH_SSL_BUNDLE:-/opt/es-certs/elasticsearch.p12}
      ELASTICSEARCH_TRUSTSTORE_PASSWORD: ${ELASTICSEARCH_TRUSTSTORE_PASSWORD:?ELASTICSEARCH_TRUSTSTORE_PASSWORD must be set}
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/opt/es-certs/elasticsearch.p12
        -Djavax.net.ssl.trustStorePassword=${ELASTICSEARCH_TRUSTSTORE_PASSWORD}
        -Djavax.net.ssl.trustStoreType=pkcs12
      ROCKETMQ_NAMESRV_ADDR: ${ROCKETMQ_NAMESRV_ADDR:-rocketmq-namesrv:9876}
      # 显式注入 HOSTNAME：logback JSON 日志依赖 ${HOSTNAME} 作为日志 host 维度标签，
      # 部分编排器（Nomad / 非 K8s Docker host）默认不会注入容器 hostname。
      # 容器名 moyuyo-server 已固定，运维可直接 grep 该字段定位日志来源节点
      HOSTNAME: ${HOSTNAME:-moyuyo-server}
      WOOCOMMERCE_URL: ${WOOCOMMERCE_URL:?WOOCOMMERCE_URL must be set}
      WOOCOMMERCE_CONSUMER_KEY: ${WOOCOMMERCE_CONSUMER_KEY:?WOOCOMMERCE_CONSUMER_KEY must be set}
      WOOCOMMERCE_CONSUMER_SECRET: ${WOOCOMMERCE_CONSUMER_SECRET:?WOOCOMMERCE_CONSUMER_SECRET must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      MOYUYO_HTTP_CONNECT_TIMEOUT_MS: ${MOYUYO_HTTP_CONNECT_TIMEOUT_MS:-5000}
      MOYUYO_HTTP_READ_TIMEOUT_MS: ${MOYUYO_HTTP_READ_TIMEOUT_MS:-15000}
      # ---- 邮件 SMTP（腾讯企业邮箱）----
      # 透传 .env 里的 SPRING_MAIL_* 到容器内,Sprint Boot relaxed binding 自动映射为 spring.mail.host 等
      # 注意:SPRING_MAIL_PASSWORD 必须是腾讯企业邮箱"客户端专用密码"(16 位),
      # 而不是网页登录密码,否则会 Authentication failed 抛 502
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-465}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS: ${SPRING_MAIL_SMTP_STARTTLS:-false}
      SPRING_MAIL_SMTP_SSL: ${SPRING_MAIL_SMTP_SSL:-true}
      # moyuyo.mail.* 业务自定义配置:发件人地址 / 显示名 / 邮件开关
      MOYUYO_MAIL_FROM: ${MOYUYO_MAIL_FROM:-}
      MOYUYO_MAIL_FROM_NAME: ${MOYUYO_MAIL_FROM_NAME:-MOYUYO Support}
      MOYUYO_MAIL_ENABLED: ${MOYUYO_MAIL_ENABLED:-true}
      # 上传文件落盘目录：必须与上方 moyuyo-uploads 卷挂载目标保持一致
      MOYUYO_UPLOAD_DIR: ${MOYUYO_UPLOAD_DIR:-/app/uploads}
      JVM_XMS: ${JVM_XMS:-1g}
      JVM_XMX: ${JVM_XMX:-2g}
      # ---- 应用功能开关与第三方服务（此前未透传，写在 .env 里不生效，现补齐）----
      # 默认值均与 application-prod.yml / application.yml 的内置默认保持一致，
      # 未在 .env 中配置时行为与补齐前完全相同
      # 限流开关（IP / 用户维度）
      MOYUYO_IP_RATELIMIT_ENABLED: ${MOYUYO_IP_RATELIMIT_ENABLED:-true}
      MOYUYO_USER_RATELIMIT_ENABLED: ${MOYUYO_USER_RATELIMIT_ENABLED:-true}
      # 链路追踪采样率（prod 默认 0.1）
      MOYUYO_TRACE_SAMPLE_RATE: ${MOYUYO_TRACE_SAMPLE_RATE:-0.1}
      # BCrypt 强度（prod 默认 12）
      MOYUYO_BCRYPT_STRENGTH: ${MOYUYO_BCRYPT_STRENGTH:-12}
      # 审计日志（prod 默认开启、保留 90 天）
      MOYUYO_AUDIT_QUEUE_CAPACITY: ${MOYUYO_AUDIT_QUEUE_CAPACITY:-10000}
      MOYUYO_AUDIT_BLOCK_ON_FULL: ${MOYUYO_AUDIT_BLOCK_ON_FULL:-false}
      MOYUYO_AUDIT_RETENTION_ENABLED: ${MOYUYO_AUDIT_RETENTION_ENABLED:-true}
      MOYUYO_AUDIT_RETENTION_DAYS: ${MOYUYO_AUDIT_RETENTION_DAYS:-90}
      # WooCommerce 库存同步定时任务（prod 默认开启）
      WC_STOCK_SYNC_ENABLED: ${WC_STOCK_SYNC_ENABLED:-true}
      WC_STOCK_SYNC_CRON: "${WC_STOCK_SYNC_CRON:-0 */5 * * * *}"
      # API 签名开关（yml 默认 false；开启需同时配置 API_SIGN_SECRET 与客户端 SDK）
      API_SIGNATURE_ENABLED: ${API_SIGNATURE_ENABLED:-false}
      # RocketMQ 总开关（prod 默认 true）
      ROCKETMQ_ENABLED: ${ROCKETMQ_ENABLED:-true}
      # 仅本地开发使用；prod 若误设为 true，ProdConfigValidator 会在启动期直接阻断
      MOYUYO_SKIP_ADMIN_INIT: ${MOYUYO_SKIP_ADMIN_INIT:-false}
      # OpenAPI 文档元数据（默认值与 application.yml 一致）
      OPENAPI_CONTACT_EMAIL: ${OPENAPI_CONTACT_EMAIL:-backend@example.com}
      OPENAPI_VERSION: ${OPENAPI_VERSION:-1.0.0}
      # 阿里云短信：MOYUYO_SMS_PROVIDER 留空时验证码仅打印日志（NoopSmsServiceImpl）
      MOYUYO_SMS_PROVIDER: ${MOYUYO_SMS_PROVIDER:-}
      MOYUYO_SMS_ACCESS_KEY_ID: ${MOYUYO_SMS_ACCESS_KEY_ID:-}
      MOYUYO_SMS_ACCESS_KEY_SECRET: ${MOYUYO_SMS_ACCESS_KEY_SECRET:-}
      MOYUYO_SMS_SIGN_NAME: ${MOYUYO_SMS_SIGN_NAME:-MOYUYO}
      MOYUYO_SMS_TEMPLATE_LOGIN: ${MOYUYO_SMS_TEMPLATE_LOGIN:-SMS_LOGIN_DEFAULT}
      MOYUYO_SMS_TEMPLATE_REGISTER: ${MOYUYO_SMS_TEMPLATE_REGISTER:-SMS_REGISTER_DEFAULT}
      MOYUYO_SMS_TEMPLATE_RESET: ${MOYUYO_SMS_TEMPLATE_RESET:-SMS_RESET_DEFAULT}
      # 物流轨迹第三方 Provider（默认 none：仅人工维护轨迹）
      MOYUYO_LOGISTICS_PROVIDER: ${MOYUYO_LOGISTICS_PROVIDER:-none}
      MOYUYO_LOGISTICS_API_KEY: ${MOYUYO_LOGISTICS_API_KEY:-}
      MOYUYO_LOGISTICS_CUSTOMER: ${MOYUYO_LOGISTICS_CUSTOMER:-}
      MOYUYO_LOGISTICS_POLL_INTERVAL: ${MOYUYO_LOGISTICS_POLL_INTERVAL:-60}
      MOYUYO_LOGISTICS_POLL_BATCH_SIZE: ${MOYUYO_LOGISTICS_POLL_BATCH_SIZE:-200}
      # Google Maps 位置服务（留空时 /api/v1/geo/* 返回"地图服务未配置"）
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # CSP 白名单：默认值与 SecurityHeadersFilter 的 @Value 默认一致，
      # 注意不能留空（空值会覆盖默认白名单，导致 CSP 头异常收紧）
      MOYUYO_SECURITY_CSP_CONNECT_SRC: ${MOYUYO_SECURITY_CSP_CONNECT_SRC:-https://api.stripe.com,https://api-m.paypal.com,https://*.sentry.io}
      MOYUYO_SECURITY_CSP_IMG_SRC: ${MOYUYO_SECURITY_CSP_IMG_SRC:-data:,https://*.moyuyo.com,https://*.moyuyoshop.com,https://*.bloomwitness.com}
      MOYUYO_SECURITY_CSP_FONT_SRC: ${MOYUYO_SECURITY_CSP_FONT_SRC:-data:}
    # 给 Spring 优雅停机 + 容器退出留出余量：Spring lifecycle 默认 30s，加 15s 容器退出 buffer
    # 避免长事务或 RocketMQ 回调未完成时被 SIGKILL
    stop_grace_period: 45s
    # 资源限制：避免单个容器拖垮宿主（按需调整；当前为单机示例）
    # 注意：docker-compose v3 deploy.resources 仅在 swarm 模式生效；
    # 单机部署可用 cpus / memory 直接约束（需 docker engine >= 19.03）
    cpus: '2.0'
    mem_limit: 4G
    mem_reservation: 1G
    # ulimit：限制 JVM 可创建线程数，避免 fork 炸弹或恶意流量打爆文件描述符
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 8192
        hard: 8192
    # 进程总数限制：默认无上限，攻击者可触发 fork bomb 让容器耗尽 PID 后无法启动新进程
    # Tomcat max-threads=600 + @Async 池 max=16 + @Scheduled=4 + RocketMQ 消费者 ≈ 700 进程
    # 显式设 4096 给监控探针、临时 shell、容器内调试留 5x 余量
    pids_limit: 4096
    # 容器标签：便于 prometheus / 1Panel 面板自动发现
    labels:
      org.opencontainers.image.source: "https://github.com/your-org/moyuyo-server"
      org.opencontainers.image.licenses: "Proprietary"
      app: "moyuyo-server"
    # 容器安全加固：read-only 根文件系统 + tmpfs 兜底虚拟写临时目录
    # 防止容器内恶意进程（被 RCE 入侵后）篡改系统文件或注入二进制
    # - /tmp：Tomcat / JVM 临时文件输出（与 -Djava.io.tmpdir 默认一致）
    # - /run：Spring Boot 启动期部分 native lib 抽取（少量）
    # - 注意：/app/heapdump 与 /var/log/moyuyo 已通过 named volume 挂载并具备写权限（read_only 不会影响 named volume）
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run:size=16m,mode=755
    # 禁用容器新权限：避免容器内进程通过 setuid 提权
    # 需 docker engine >= 19.03
    security_opt:
      - no-new-privileges:true
    # seccomp 配置文件：使用 docker 默认（apparmor / selinux 在 Linux 主机生效）
    # 本环境 docker.io 默认开启 seccomp，不显式指定
    healthcheck:
      # 与 Dockerfile 内 HEALTHCHECK 一致，docker compose up 可基于此等待健康
      # 关键防御：健康检查绕过限流 / 鉴权过滤器（否则 IP 限流过滤器会把 actuator 调用
      # 当成未鉴权流量拦截）。Spring 默认 health 端点路径不受 @PreAuthorize 保护，
      # 但 /api/* 路径的 TraceId / IpRateLimit / JwtAuth 等过滤器仍会触发。
      # actuator 走 management.server.port=9090（独立端口 + 127.0.0.1 绑定），
      # 完全绕过 /api/* 的过滤器链，仅命中 SecurityHeadersFilter（order=MIN_VALUE）
      # 该过滤器对 /actuator/** 仅 setHeader 不拦截业务，保证健康检查零阻塞
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9090/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # MySQL 监控导出器（mysqld_exporter）
  # 抓取连接数、长事务、慢查询等指标，供 Prometheus 抓取
  # 仅绑定本机回环，由 Prometheus 直连
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: moyuyo-mysqld-exporter
    restart: unless-stopped
    # 必须以 root 连接 MySQL 才能采集 information_schema / performance_schema
    # 安全：由 docker-compose 内部网络访问，外网不可达
    environment:
      DATA_SOURCE_NAME: "exporter:${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD must be set}@(mysql:3306)/"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9104:9104"
    depends_on:
      mysql:
        condition: service_healthy
    # 资源限制：mysqld-exporter 是单进程 Go 应用，常驻内存约 30MB；
    # 设置 mem_limit=128M 给 metrics 解析 + buffer 留余量，避免被宿主机 OOM-killer 杀掉
    cpus: '0.2'
    mem_limit: 128M
    mem_reservation: 32M
    # 健康检查：避免 exporter 进程异常但端口仍可达时被 Prometheus 抓取到陈旧指标
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9104/metrics >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 无需挂卷，无状态

  # Redis 监控导出器（redis_exporter）
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: moyuyo-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      # 强制使用独立的 redis_exporter 监控密码（不允许与 REDIS_PASSWORD 复用），
      # ProdConfigValidator 在应用启动期校验；如复用会让 exporter 被入侵后获得完整 Redis 权限
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:?REDIS_EXPORTER_PASSWORD must be set}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    # 资源限制：redis_exporter 是单进程 Go 应用，常驻内存约 30MB；
    # 设置 mem_limit=128M 给 metrics 解析 + buffer 留余量
    cpus: '0.2'
    mem_limit: 128M
    mem_reservation: 32M
    # 健康检查：避免 exporter 进程崩溃但端口仍可达时被 Prometheus 抓取到空指标
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9121/metrics >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # RocketMQ 监控导出器（rocketmq-exporter）
  # 抓取 RocketMQ broker / consumer / topic 指标（消息堆积、broker 延迟、生产消费比）
  # 由 Prometheus 抓取，仅绑定本机回环
  rocketmq-exporter:
    image: apache/rocketmq-exporter:0.0.3
    container_name: moyuyo-rocketmq-exporter
    restart: unless-stopped
    command:
      - "--rocketmq.config.namesrvAddr=rocketmq-namesrv:9876"
    ports:
      - "127.0.0.1:5557:5557"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    # 资源限制：rocketmq-exporter 是 Java 进程，常驻内存约 200MB；
    # 设置 mem_limit=512M 给 JVM 堆 + buffer 留余量
    cpus: '0.5'
    mem_limit: 512M
    mem_reservation: 128M
    # 健康检查：避免 exporter 异常但端口仍可达时被 Prometheus 抓取到陈旧指标
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5557/metrics >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mysql-data:
  # MySQL 自签 CA 导出的 PKCS12 信任库（mysql-certs-init 写入，app 只读挂载）
  mysql-certs:
  redis-data:
  es-data:
  es-certs:
  moyuyo-logs:
  moyuyo-heapdump:
  # 上传文件持久卷：挂载到 app 容器的 MOYUYO_UPLOAD_DIR
  moyuyo-uploads:
  rocketmq-data:
  rocketmq-logs:
  # MySQL / Redis 日志命名卷：与 moyuyo-logs 分开，避免日志滚转互相影响
  moyuyo-mysql-logs:
  moyuyo-redis-logs:

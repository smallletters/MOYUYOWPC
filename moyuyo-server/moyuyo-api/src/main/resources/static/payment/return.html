<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f6f2ee;
            color: #2e2b29;
            margin: 0;
            padding: 40px 24px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 32px 24px;
            max-width: 360px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        .icon {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 16px;
        }
        .success { color: #067d62; }
        .failed { color: #c0116e; }
        h2 { margin: 0 0 8px; font-size: 22px; }
        p { margin: 0; color: #6e6e73; font-size: 14px; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon" id="icon">⏳</div>
    <h2 id="title">Processing your payment...</h2>
    <p id="hint">Please return to the app to view the result.</p>
</div>

<script>
    // 解析 URL query：?status=success|fail&orderNo=xxx&message=xxx&scheme=moyuyo
    // Stripe Checkout Session 会在 successUrl 后追加 &session_id={CHECKOUT_SESSION_ID}，一并透传给 APP
    // APP 端如果用 HTTP 版 return.html 兜底（没命中 moyuyo:// 直接回跳），
    // 我们会主动 location.href = moyuyo://pay/return?status=xxx 跳回 APP，
    // 避免 WebView 卡在支付结果页、用户不知道要返回哪里。
    (function () {
        var params = new URLSearchParams(window.location.search);
        var status = (params.get('status') || '').toLowerCase();
        var message = params.get('message') || '';
        var orderNo = params.get('orderNo') || '';
        var schemeBase = params.get('scheme') || 'moyuyo://pay/return';
        var iconEl = document.getElementById('icon');
        var titleEl = document.getElementById('title');
        var hintEl = document.getElementById('hint');

        if (status === 'success') {
            iconEl.textContent = '✓';
            iconEl.className = 'icon success';
            titleEl.textContent = 'Payment successful';
            hintEl.textContent = 'You can return to the app now.';
        } else if (status === 'cancel' || status === 'failed') {
            iconEl.textContent = '✕';
            iconEl.className = 'icon failed';
            titleEl.textContent = 'Payment cancelled';
            hintEl.textContent = message || 'You have cancelled the payment.';
        }

        var payload = {
            type: 'pay_result',
            status: status || 'unknown',
            message: message,
            orderNo: orderNo,
            sessionId: params.get('session_id') || '',
            timestamp: Date.now()
        };

        // 通道 1：向 uni-app <web-view> 父容器发 postMessage（H5 + APP 内嵌通用）
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(payload, '*');
            }
        } catch (e) {}

        // 通道 2：localStorage 兜底（浏览器/H5 刷新、新标签打开等场景）
        try {
            localStorage.setItem('moyuyo_pay_result', JSON.stringify(payload));
        } catch (e) {}

        // 通道 3：APP 端兜底跳自定义 scheme
        // 识别依据：userAgent 里包含 uni-app / Html5Plus / HBuilderX 任一关键字
        // 或浏览器是 in-app webview 环境（非 http(s) 顶层打开）
        function isAppWebView() {
            var ua = (navigator.userAgent || '').toString();
            if (/Html5Plus|uni-app|HBuilderX|Moyuyo/i.test(ua)) return true;
            // iOS WKWebView：不出现 Safari 关键字却存在 Mobile/*
            if (/iPhone|iPad|iPod/.test(ua) && !/Safari/.test(ua)) return true;
            // Android WebView：出现 wv / _ 且无 Chrome 版本标记（Chrome + Version 关键字）
            if (/Android/.test(ua) && (/wv\)/.test(ua) || /; wv /.test(ua))) return true;
            return false;
        }
        function jumpScheme() {
            try {
                var sep = schemeBase.indexOf('?') === -1 ? '?' : '&';
                var dest = schemeBase + sep
                    + 'status=' + encodeURIComponent(status || '')
                    + '&orderNo=' + encodeURIComponent(orderNo)
                    + (message ? '&message=' + encodeURIComponent(message) : '');
                window.location.href = dest;
            } catch (e) {}
        }
        if (isAppWebView()) {
            // 展示完结果后 200ms 自动回跳 APP
            setTimeout(jumpScheme, 200);
        }
    })();
</script>
</body>
</html>

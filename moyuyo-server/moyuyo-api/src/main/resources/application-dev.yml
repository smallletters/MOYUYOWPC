# ===== 开发环境配置 =====
# 仅在 SPRING_PROFILES_ACTIVE=dev 时激活
# 此处允许"测试用"默认值（弱密码、本地连接），绝对不能用于生产

# SpringDoc dev 环境显式开启（便于本地联调查看 API）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Actuator info dev 开启，便于本地调试查看构建版本
management:
  info:
    env:
      enabled: true
    git:
      mode: simple
      enabled: true
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

spring:
  # 数据库
  datasource:
    url: jdbc:mysql://localhost:3306/moyuyo_dev?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    # ⚠️ 弱默认值，仅本地开发
    password: ${MYSQL_PASSWORD:dev123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # dev 环境显式置空 truststore（application.yml 默认值 file:/opt/mysql-certs/mysql-ca.p12 在本地不存在时会启动失败）
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      data-source-properties:
        trustCertificateKeyStoreUrl:
        trustCertificateKeyStorePassword:

  main:
    # dev 启用 banner 输出到 console，便于本地确认 Spring 启动成功
    banner-mode: console

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # Elasticsearch（dev 可选；显式关闭 SSL 以匹配本地 elasticsearch.yml 默认配置）
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 60s
    # dev 默认关闭 SSL：本地通常无证书；prod 强制开启并校验证书
    ssl:
      enabled: false
      certificate-validation: false

  # Flyway dev 配置：可 repair，加载 seed
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    repair-on-migrate: true
    # dev 默认关闭破坏性分区迁移（V20260804_02），避免与 mo_order.uk_order_no 唯一索引冲突
    # 切换生产或需要 dev 验证分区时，传入 -Dspring.flyway.placeholders.moyuyo_enable_partition=true
    placeholders:
      moyuyo_enable_partition: 'false'

# JWT 开发密钥
jwt:
  secret: ${JWT_SECRET:DevOnlyJWT_Secret#2026_KeyForLocalTesting!}
  expire-hours: 8

# CORS 开发开放
moyuyo:
  cors:
    allowed-origins: ${MOYUYO_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:8080,http://127.0.0.1:8080,http://192.168.6.103:8080,http://192.168.6.103:5173,http://192.168.6.103:5174}
  # dev 环境降低密码哈希强度（避免注册/登录阻塞开发体验）；
  # 平时建议不动；如做性能测试可调高（受 Moyuyo 范围 4~31 约束）
  password:
    bcrypt-strength: ${MOYUYO_BCRYPT_STRENGTH:10}
  # dev 默认禁用审计日志保留期清理任务（避免本地开发被定时清理影响联调）
  # 生产环境由 application-prod.yml 强制开启
  audit:
    retention-enabled: false
    # dev 默认较小队列 + 较快 flush，便于本地调试观察落库行为
    queue-capacity: 1000
    batch-size: 50
    flush-interval-ms: 500
  # dev 环境 OpenAPI 文档元数据：便于本地联调查看，无需走 env 注入
  openapi:
    contact-email: ${OPENAPI_CONTACT_EMAIL:dev@moyuyo.local}
    # dev 环境默认 1.0.0；CI/CD 可通过 OPENAPI_VERSION 覆盖
    version: ${OPENAPI_VERSION:1.0.0}
    # dev 环境显式列出本地 + 局域网服务器，便于切换调试
    # 生产环境 springdoc.api-docs.enabled=false 时这些配置不会生效
    servers: ${OPENAPI_SERVERS:http://localhost:8080|本地开发,http://192.168.1.100:8080|局域网联调}
    # dev 默认不附加 License URL（避免本地调试时显示生产 URL 误导）；生产环境由 OPENAPI_LICENSE_URL 控制
    license-url: ${OPENAPI_LICENSE_URL:}

# API 签名（dev 默认空）
api:
  signature:
    secret: ${API_SIGN_SECRET:}

# 管理员默认账号（dev 友好）
admin:
  # ⚠️ 使用合法的非弱用户名（admin 是 OWASP 黑名单，禁止作为默认值）
  username: ${ADMIN_USERNAME:moyuyo_admin}
  email: ${ADMIN_EMAIL:admin@moyuyo.com}
  password: ${ADMIN_PASSWORD:moyuyo_Dev#2026!}

# MyBatis-Plus SQL 日志：dev 用 stdout
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# RocketMQ
rocketmq:
  # dev 默认禁用：本机通常没有 RocketMQ，避免启动时连接 null 阻塞
  enabled: ${ROCKETMQ_ENABLED:false}
  name-server: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
  producer:
    group: moyuyo-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# 支付渠道（dev 使用 sandbox 占位）
payment:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    currency: usd
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:placeholder}
    client-secret: ${PAYPAL_CLIENT_SECRET:placeholder}
    webhook-id: ${PAYPAL_WEBHOOK_ID:placeholder}
    mode: sandbox
    allowed-origins: ${PAYPAL_ALLOWED_ORIGINS:https://moyuyo.com}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    mch-id: ${WECHAT_MCH_ID:}
    api-key: ${WECHAT_API_KEY:}
    cert-path: ${WECHAT_CERT_PATH:}
    notify-url: ${WECHAT_REFUND_NOTIFY_URL:https://api.moyuyo.com/api/v1/webhook/wechat-refund}
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway: ${ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}
    notify-url: ${ALIPAY_REFUND_NOTIFY_URL:https://api.moyuyo.com/api/v1/webhook/alipay-refund}
  unionpay:
    merchant-id: ${UNIONPAY_MERCHANT_ID:}
    cert-path: ${UNIONPAY_CERT_PATH:}
    cert-password: ${UNIONPAY_CERT_PASSWORD:}
    gateway: ${UNIONPAY_GATEWAY:https://gateway.95516.com/gateway/api/frontTransReq.do}
    notify-url: ${UNIONPAY_REFUND_NOTIFY_URL:https://api.moyuyo.com/api/v1/webhook/unionpay-refund}

# WooCommerce
woocommerce:
  url: ${WOOCOMMERCE_URL:https://your-woocommerce-store.com}
  consumer-key: ${WOOCOMMERCE_CONSUMER_KEY:}
  consumer-secret: ${WOOCOMMERCE_CONSUMER_SECRET:}
  connect-timeout: ${MOYUYO_HTTP_CONNECT_TIMEOUT_MS:10000}
  read-timeout: ${MOYUYO_HTTP_READ_TIMEOUT_MS:30000}
  stock-sync:
    auto-enabled: ${WC_STOCK_SYNC_ENABLED:false}
    cron: ${WC_STOCK_SYNC_CRON:0 */5 * * * *}

# Resilience4j 限流（dev 宽松）
resilience4j:
  ratelimiter:
    instances:
      authLogin:
        limit-refresh-period: 1m
        limit-for-period: 600
        timeout-duration: 500ms
      orderCreate:
        limit-refresh-period: 1m
        limit-for-period: 300
        timeout-duration: 500ms
      paymentApi:
        limit-refresh-period: 1m
        limit-for-period: 500
        timeout-duration: 500ms
      seckillApi:
        limit-refresh-period: 1m
        limit-for-period: 2000
        timeout-duration: 1s
      # P1 修复：为高价值写接口补充限流
      refundBatch:
        limit-refresh-period: 1m
        limit-for-period: 50
        timeout-duration: 500ms
      inventoryUpdate:
        limit-refresh-period: 1m
        limit-for-period: 100
        timeout-duration: 500ms
      configUpdate:
        limit-refresh-period: 1m
        limit-for-period: 30
        timeout-duration: 500ms
      # dev 环境放宽到 1000/min，远高于 prod 但仍保留限流语义：
      # 避免本地调试时每次操作都被拦截；保留上限便于排查无意识的脚本调用风暴
      batchImport:
        limit-refresh-period: 1m
        limit-for-period: 1000
        timeout-duration: 0
      dataExport:
        limit-refresh-period: 1m
        limit-for-period: 1000
        timeout-duration: 0
      pushAction:
        limit-refresh-period: 1m
        limit-for-period: 60
        timeout-duration: 500ms
      riskRuleUpdate:
        limit-refresh-period: 1m
        limit-for-period: 30
        timeout-duration: 500ms
      feedbackSubmit:
        limit-refresh-period: 1m
        limit-for-period: 200
        timeout-duration: 500ms
      # 社区发帖：dev 放宽便于本地调试，但保留上限避免脚本刷屏
      postCreate:
        limit-refresh-period: 1m
        limit-for-period: 120
        timeout-duration: 500ms
      # 社区评论：dev 放宽
      commentCreate:
        limit-refresh-period: 1m
        limit-for-period: 200
        timeout-duration: 500ms
      # 领券：dev 放宽
      couponClaim:
        limit-refresh-period: 1m
        limit-for-period: 100
        timeout-duration: 500ms
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 30
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      dbWrite:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
      woocommerceApi:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      paymentCallback:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.dao.DataAccessException
      woocommerceSync:
        max-attempts: 3
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 10s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
          - java.io.IOException
<!DOCTYPE html>
<html lang="zh-CN" class="theme-light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MOYUYO ATELIER · Linen &amp; Brass · Phase 3 交互原型</title>
<style id="lucide-css">/*LUCIDE_INLINE*/</style>
<style>
/* ==========================================================================
   MOYUYO · Linen & Brass — Phase 3 可交互原型
   视觉真值源：phase1-visual-direction.md v1.5 + phase2-ux-spec.md v1.1
   §4 的 48+ token 原样搬入；单位换算见 §6.13.5（1rpx ≈ 0.52px @390 视口）
   注释中的 rpx 数字 = 真实 uni-app 实现侧应填的数值
   ========================================================================== */

/* ---------- §4 共享设计系统 ---------- */
:root{
  /* ===== 既有 token（variables.scss 原文） ===== */
  --color-primary:#dbc98a; --color-primary-light:#e8ddb5; --color-primary-dark:#b8a66b;
  --color-background:#f6f2ee; --color-surface:#ffffff;
  --color-text:#2e2b29; --color-text-secondary:#6e6962; --color-text-tertiary:#9a948c;
  --color-divider:#eae5dd;
  --color-fill:#f2f2f7; --color-fill-hi:#f7f7fa; --color-fill-raised:#ffffff;
  --color-overlay-subtle:rgba(0,0,0,.04);
  --color-fill-dim:#d1d1d6; --color-fill-dim-strong:#c7c7cc;
  --color-surface-veil-88:rgba(255,255,255,.88);
  --color-surface-veil-92:rgba(255,255,255,.92);
  --color-surface-veil-95:rgba(255,255,255,.95);
  --color-accent:#b38a5a; --color-success:#abb9ad; --color-warm:#d9b4b0;
  --color-warning:#e6b97a; --color-danger:#c96e5f; --color-info:#8fa8b6;
  --color-card:#ffffff;
  --state-success:#abb9ad; --state-success-surface:rgba(171,185,173,.15);
  --state-error:#c96e5f;  --state-error-surface:rgba(201,110,95,.15);
  --state-warning:#e6b97a;--state-warning-surface:rgba(230,185,122,.15);
  --color-error:#c96e5f; --secondary:#f2f2f7; --secondary-foreground:#2e2b29;
  --color-text-primary:#2e2b29; --color-primary-bg:rgba(219,201,138,.15);
  --color-care:#dbc98a; --color-gear:#abb9ad; --color-play:#b38a5a; --color-home:#d9b4b0;

  /* ===== §4.1 品牌强调梯度（v1.2 会员卡改暗古铜） ===== */
  --brand-gradient-vip:linear-gradient(135deg,#7E6B36 0%,#6B5F3A 50%,#554A26 100%);
  --brand-gradient-hero:linear-gradient(135deg,#E6D59A 0%,#C9B47A 100%);
  --brand-gradient-ink:linear-gradient(180deg,rgba(46,43,41,0) 0%,rgba(46,43,41,.18) 42%,rgba(46,43,41,.62) 100%);
  --brand-scrim-flat:rgba(46,43,41,.52);
  --accent-soft:rgba(219,201,138,.18);
  --accent-strong:rgba(219,201,138,.34);
  --text-on-accent:#2E2B29;
  --text-inverse:#F6F2EE;

  /* ===== §4.2 分级表面 ===== */
  --surface-elevated:#FFFFFF;
  --surface-sunken:#F0ECE6;
  --surface-mute:#FAF8F5;
  --surface-inverse:#2E2B29;

  /* ===== §4.3 图片占位与渐变遮罩 ===== */
  --img-placeholder:linear-gradient(135deg,#ECE6DD 0%,#E3DCD1 100%);
  --img-placeholder-flat:#ECE6DD;
  --img-ratio-square:100%;
  --img-ratio-landscape:75%;
  --img-ratio-portrait:133%;
  --img-ratio-banner:56.25%;

  /* ===== §4.4 标签 chip ===== */
  --chip-bg:#F0ECE6;
  --chip-bg-strong:#E6E0D6;
  --chip-text:#6E6962;
  --chip-text-strong:#2E2B29;
  --chip-accent-bg:#F5EFDD;
  --chip-accent-text:#6B5F3A;

  /* ===== §4.5 分割线两级 ===== */
  --divider-weak:#F0ECE6;
  --divider-strong:#E2DCD3;

  /* ===== §4.6 骨架屏（v1.3 补 --skeleton-gradient） ===== */
  --skeleton-base:#EFE9E1;
  --skeleton-highlight:#F7F3ED;
  --skeleton-radius:4.2px;   /* 8rpx */
  --skeleton-duration:1.4s;
  --skeleton-gradient:linear-gradient(90deg,var(--skeleton-base) 25%,var(--skeleton-highlight) 50%,var(--skeleton-base) 75%);

  /* ===== §4.7 文字/交互/圆角/阴影/字体/布局 ===== */
  --text-secondary-strong:#55504A;
  --text-link:#8A7844;
  --text-muted-inverse:rgba(246,242,238,.72);
  --state-press:rgba(46,43,41,.06);
  --state-hover:rgba(46,43,41,.03);
  --focus-ring:rgba(138,120,68,.45);
  --radius-xs:3.1px;    /* 6rpx  */
  --radius-sm:4.2px;    /* 8rpx  */
  --radius-md:8.3px;    /* 16rpx */
  --radius-lg:12.5px;   /* 24rpx */
  --radius-xl:16.6px;   /* 32rpx */
  --radius-2xl:20.8px;  /* 40rpx */
  --radius-pill:9999px;
  --radius-circle:50%;
  --shadow-brand:0 4.2px 12.5px rgba(138,120,68,.26);
  --shadow-brand-sm:0 2.1px 6.3px rgba(138,120,68,.20);
  --shadow-none:none;
  --font-display:'Playfair Display',Georgia,'Songti SC','STSong','Noto Serif CJK SC',serif;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --tracking-kicker:.18em;
  --tracking-tight:-.01em;
  --gutter:16.6px;      /* 32rpx */
  --section-gap:25px;   /* 48rpx */
  --stack-gap:12.5px;   /* 24rpx */
  --icon-xs:12.5px; --icon-sm:16.6px; --icon-md:20.8px; --icon-lg:25px; --icon-xl:29.1px;

  /* ===== §4.7 v1.2 新增 --color-danger-strong（承载文字的危险表面） ===== */
  --color-danger-strong:#B3574B;
  --on-danger:#FFFFFF;

  /* ===== §4.7 v1.3 新增动效 / 层级 / 禁用态 ===== */
  --duration-fast:120ms; --duration-base:200ms; --duration-slow:320ms;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --z-sticky:20; --z-fab:60; --z-sheet:80; --z-modal:100;
  --state-disabled-bg:#D1D1D6; --state-disabled-text:#9A948C;

  /* ===== §4.8 字号阶 ===== */
  --font-size-2xs:10.4px; /* 20rpx */
  --font-size-xs:11.4px;  /* 22rpx */
  --font-size-sm:13.5px;  /* 26rpx */
  --font-size-base:14.6px;/* 28rpx */
  --font-size-md:15.6px;  /* 30rpx */
  --font-size-lg:16.6px;  /* 32rpx */
  --font-size-xl:18.7px;  /* 36rpx */
  --font-size-2xl:22.9px; /* 44rpx — Hero 标题（唯一使用处）*/
  --font-size-3xl:29.1px; /* 56rpx — 会员卡等级名（唯一使用处）*/
  --font-size-4xl:35.4px; /* 68rpx — 预留，当前 5 tab 不使用 */

  /* ===== 既有圆角/间距/阴影 ===== */
  --space-xs:4.2px; --space-sm:8.3px; --space-md:12.5px; --space-lg:16.6px; --space-xl:25px; --space-2xl:33.2px;
  --shadow-sm:0 .5px 2px rgba(46,43,41,.04);
  --shadow-md:0 2.1px 8.3px rgba(46,43,41,.06);
  --shadow-lg:0 4.2px 12.5px rgba(46,43,41,.1);
  --shadow-card-sm:0 1px 4px rgba(46,43,41,.04);
  --shadow-card-md:0 1px 6px rgba(46,43,41,.04);
  --shadow-card-lg:0 1px 8px rgba(46,43,41,.04);
  --shadow-pop:0 3.1px 10px rgba(46,43,41,.04);

  /* ===== 原型专用：状态条/状态栏尺寸 ===== */
  --statusbar-h:44px;
  --tabbar-h:56px;
  --home-indicator-h:22px;

  /* ===== 原型专用：浅色模式下可安全作文字的金色 =====
     §4.10：--text-link #8A7844 在亚麻底仅 3.89:1，未达 AA；
     故浅色端统一改用 --chip-accent-text #6B5F3A（5.68:1 达标），深色端用 --text-link #C9B47A */
  --link-text:var(--chip-accent-text);
}

/* ---------- 暗色：按 §5 各页第 5 小节逐条实现（非 filter 反色） ---------- */
.theme-dark{
  --color-background:#1a1816; --color-surface:#2a2724;
  --color-text:#f6f2ee; --color-text-secondary:#b8b0a5; --color-text-tertiary:#8c857c;
  --color-divider:#3a3530;
  --color-fill:#35312d; --color-fill-hi:#403b36; --color-fill-raised:#403b36;
  --color-overlay-subtle:rgba(255,255,255,.07);
  --color-fill-dim:#45403a; --color-fill-dim-strong:#4e4944;
  --color-card:#2a2724; --secondary:#35312d; --secondary-foreground:#f6f2ee;
  --color-text-primary:#f6f2ee; --color-primary-bg:rgba(201,180,122,.2);
  --color-surface-veil-88:rgba(42,39,36,.88);
  --color-surface-veil-92:rgba(42,39,36,.92);
  --color-surface-veil-95:rgba(42,39,36,.95);
  --color-primary:#c9b47a; --color-primary-light:#d9c68f; --color-primary-dark:#a8964f;
  --color-danger:#D9836F;
  --state-error:#D9836F; --state-error-surface:rgba(217,131,111,.16);
  --shadow-sm:0 .5px 2px rgba(0,0,0,.3); --shadow-md:0 2.1px 8.3px rgba(0,0,0,.4);
  --shadow-lg:0 4.2px 12.5px rgba(0,0,0,.5);
  --shadow-card-sm:0 1px 4px rgba(0,0,0,.4); --shadow-card-md:0 1px 6px rgba(0,0,0,.4);
  --shadow-card-lg:0 1px 8px rgba(0,0,0,.4); --shadow-pop:0 3.1px 10px rgba(0,0,0,.45);

  /* §4.1 深色 */
  --brand-gradient-vip:linear-gradient(135deg,#4A432C 0%,#3A341F 55%,#2A2619 100%);
  --brand-gradient-hero:linear-gradient(135deg,#5A5030 0%,#3A3423 100%);
  --brand-gradient-ink:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.30) 42%,rgba(0,0,0,.72) 100%);
  --brand-scrim-flat:rgba(0,0,0,.62);
  --accent-soft:rgba(201,180,122,.16);
  --accent-strong:rgba(201,180,122,.28);
  --text-on-accent:#1A1816;
  --text-inverse:#F6F2EE;
  /* §4.2 深色 */
  --surface-elevated:#322E2A; --surface-sunken:#211E1B; --surface-mute:#262320; --surface-inverse:#F6F2EE;
  /* §4.3 深色 */
  --img-placeholder:linear-gradient(135deg,#2C2926 0%,#232120 100%);
  --img-placeholder-flat:#2C2926;
  /* §4.4 深色 */
  --chip-bg:#322E2A; --chip-bg-strong:#3B3630; --chip-text:#B8B0A5;
  --chip-text-strong:#F6F2EE; --chip-accent-bg:#383122; --chip-accent-text:#D9C68F;
  /* §4.5 深色 */
  --divider-weak:#2F2B27; --divider-strong:#453F39;
  /* §4.6 深色 */
  --skeleton-base:#2E2A27; --skeleton-highlight:#3C3732;
  /* §4.7 深色 */
  --text-secondary-strong:#CFC7BB; --text-link:#C9B47A;
  --state-press:rgba(255,255,255,.08); --state-hover:rgba(255,255,255,.05);
  --focus-ring:rgba(201,180,122,.55);
  --shadow-brand:0 4.2px 12.5px rgba(138,120,68,.22);
  --shadow-brand-sm:0 2.1px 6.3px rgba(0,0,0,.45);
  --link-text:var(--text-link);
  /* v1.2：深色端 --color-danger-strong 承文字必须用 Charcoal 字 */
  --color-danger-strong:#D9836F;
  --on-danger:#2E2B29;
  --state-disabled-bg:#4E4944; --state-disabled-text:#807A72;
}

/* ==========================================================================
   原型外壳
   ========================================================================== */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:#262320;font-family:var(--font-sans);color:#e9e4dd;-webkit-font-smoothing:antialiased;}
.proto-bar{
  position:sticky;top:0;z-index:120;background:#1b1917;border-bottom:1px solid #3a3530;
  padding:10px 18px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;
}
.pb-brand{display:flex;flex-direction:column;line-height:1.2;margin-right:6px;}
.pb-brand b{font-family:var(--font-display);font-size:16px;font-weight:500;letter-spacing:var(--tracking-kicker);color:#e9e4dd;}
.pb-brand span{font-size:11px;color:#9a948c;letter-spacing:.06em;}
.pb-group{display:flex;align-items:center;gap:8px;}
.pb-label{font-size:11px;color:#8f8981;letter-spacing:.08em;text-transform:uppercase;}
.pb-tabs{display:flex;gap:4px;background:#262320;border:1px solid #3a3530;border-radius:8px;padding:3px;}
.pb-tabs button{display:flex;align-items:center;gap:5px;background:transparent;border:0;color:#b8b0a5;font-family:inherit;font-size:12px;padding:6px 10px;border-radius:6px;cursor:pointer;transition:background .16s,color .16s;}
.pb-tabs button i{font-size:14px;}
.pb-tabs button:hover{background:#33302c;color:#e9e4dd;}
.pb-tabs button.on{background:#dbc98a;color:#2E2B29;}
.seg{display:flex;background:#262320;border:1px solid #3a3530;border-radius:8px;padding:3px;}
.seg button{background:transparent;border:0;color:#b8b0a5;font-family:inherit;font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.seg button i{font-size:13px;}
.seg button.on{background:#3b3630;color:#f6f2ee;}
.pb-sel{background:#262320;border:1px solid #3a3530;color:#e9e4dd;font-family:inherit;font-size:12px;padding:7px 10px;border-radius:8px;min-width:210px;cursor:pointer;}
.pb-btn{background:#3b3630;border:1px solid #4a443e;color:#e9e4dd;font-family:inherit;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.pb-btn:hover{background:#474139;}
.pb-btn.accent{background:#dbc98a;color:#2E2B29;border-color:#dbc98a;font-weight:500;}
.pb-btn.accent:hover{background:#c9b47a;}
.pb-btn i{font-size:13px;}

.stage{display:flex;gap:26px;align-items:flex-start;justify-content:center;padding:26px 20px 70px;flex-wrap:wrap;}

.phone{
  width:390px;height:844px;flex:0 0 390px;position:relative;background:var(--color-background);
  border-radius:44px;overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 11px #171514,0 0 0 12px #3a3530;
}
.phone-screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--color-background);transition:background .2s ease;}
.statusbar{
  flex:0 0 var(--statusbar-h);height:var(--statusbar-h);display:flex;align-items:center;justify-content:space-between;
  padding:0 22px 0 26px;position:relative;z-index:60;background:var(--color-background);color:var(--color-text);
  font-size:13px;font-weight:600;letter-spacing:.02em;
}
.statusbar .sb-right{display:flex;align-items:center;gap:5px;}
.viewport{flex:1 1 auto;position:relative;overflow:hidden;background:var(--color-background);}
.page{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;color:var(--color-text);
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity var(--duration-base) ease,transform var(--duration-base) ease;
  -webkit-overflow-scrolling:touch;
}
.page.is-active{opacity:1;transform:none;pointer-events:auto;}
.page::-webkit-scrollbar{width:0;}

.tabbar{
  flex:0 0 var(--tabbar-h);height:var(--tabbar-h);display:flex;align-items:stretch;
  background:var(--color-surface);border-top:1px solid var(--divider-weak);position:relative;z-index:50;
}
.tb-item{
  flex:1;background:transparent;border:0;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--color-text-tertiary);font-family:inherit;font-size:10px;letter-spacing:.02em;transition:color var(--duration-fast);
}
.tb-item i{font-size:21px;}
.tb-item.on{color:var(--color-primary);}
/* 角标：只有 messages 挂数字；一律不用金色 */
.tb-badge{
  position:absolute;top:4px;left:calc(50% + 6px);min-width:15px;height:15px;padding:0 4px;
  border-radius:var(--radius-pill);background:var(--color-danger-strong);color:var(--on-danger);
  font-size:10px;line-height:15px;text-align:center;font-weight:500;
}
.home-indicator{flex:0 0 var(--home-indicator-h);height:var(--home-indicator-h);background:var(--color-surface);display:flex;align-items:center;justify-content:center;}
.home-indicator span{width:134px;height:5px;border-radius:3px;background:var(--color-text);opacity:.28;}

.spec{
  flex:0 0 400px;width:400px;max-height:calc(100vh - 132px);background:#1b1917;border:1px solid #3a3530;border-radius:14px;
  display:flex;flex-direction:column;overflow:hidden;
}
.spec.is-collapsed{flex-basis:0;width:0;border:0;}
.spec-head{padding:12px 14px;border-bottom:1px solid #3a3530;display:flex;align-items:center;gap:8px;background:#211f1d;}
.spec-head h3{margin:0;font-family:var(--font-display);font-size:15px;font-weight:500;letter-spacing:.04em;color:#f0ebe4;}
.spec-head .sub{font-size:11px;color:#8f8981;margin-left:auto;}
.spec-body{overflow-y:auto;padding:10px 12px 22px;}
.spec-body::-webkit-scrollbar{width:6px;}
.spec-body::-webkit-scrollbar-thumb{background:#3a3530;border-radius:3px;}
.spec-card{border:1px solid #35312d;border-radius:10px;padding:10px 11px;margin-bottom:9px;background:#201e1c;}
.spec-card h4{margin:0 0 7px;font-size:12.5px;font-weight:600;color:#dbc98a;display:flex;align-items:center;gap:7px;}
.spec-card h4 .role{margin-left:auto;font-size:10px;font-weight:400;padding:2px 7px;border-radius:999px;background:#332f2b;color:#b8b0a5;border:1px solid #403b36;white-space:nowrap;}
.spec-card h4 .role.hero{background:rgba(219,201,138,.16);color:#dbc98a;border-color:rgba(219,201,138,.35);}
.spec-card dl{margin:0;display:grid;grid-template-columns:76px 1fr;gap:4px 8px;}
.spec-card dt{font-size:10.5px;color:#8f8981;letter-spacing:.04em;padding-top:1px;}
.spec-card dd{margin:0;font-size:11.5px;line-height:1.55;color:#c9c2b9;}
.spec-card dd b{color:#e9e4dd;font-weight:600;}
.spec-card dd .warn{color:#d9c68f;}
.spec-empty{color:#8f8981;font-size:12px;text-align:center;padding:30px 0;}
.spec-filter{display:flex;gap:6px;padding:0 12px 10px;}
.spec-filter button{flex:1;background:#262320;border:1px solid #3a3530;color:#b8b0a5;font-family:inherit;font-size:11px;padding:5px 6px;border-radius:7px;cursor:pointer;}
.spec-filter button.on{background:#3b3630;color:#f6f2ee;border-color:#4a443e;}

/* ==========================================================================
   通用零件
   ========================================================================== */
.app-header{
  position:sticky;top:0;z-index:var(--z-sticky);min-height:50px;padding:0 var(--gutter);
  display:flex;align-items:center;gap:10px;
  background:var(--color-surface-veil-95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--divider-weak);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .app-header{background:var(--color-surface);}
}
.ah-left{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;}
.wordmark{font-family:var(--font-display);font-size:14.6px;font-weight:500;letter-spacing:var(--tracking-kicker);color:var(--color-text);}
.ah-right{margin-left:auto;display:flex;align-items:center;gap:2px;}
.icon-btn{
  width:38px;height:38px;border:0;border-radius:var(--radius-circle);background:transparent;
  display:flex;align-items:center;justify-content:center;color:var(--color-text);cursor:pointer;position:relative;transition:background var(--duration-fast);
}
.icon-btn i{font-size:20.8px;}
.icon-btn:hover{background:var(--state-hover);}
.icon-btn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--color-danger);}
.icon-btn .dot.sm{width:6px;height:6px;top:9px;right:9px;}

.kicker{font-size:var(--font-size-2xs);letter-spacing:var(--tracking-kicker);text-transform:uppercase;color:var(--color-text-tertiary);font-weight:400;}
.kicker.on-img{color:var(--text-muted-inverse);}
.display{font-family:var(--font-display);font-weight:400;color:var(--color-text);}
.link-text{color:var(--link-text);background:none;border:0;font-family:inherit;font-size:var(--font-size-sm);cursor:pointer;padding:0;}

.ph{position:relative;overflow:hidden;background:var(--img-placeholder);border-radius:var(--radius-md);}
.ph > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.ph .ph-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--color-text-tertiary);}
.ph .ph-fallback i{font-size:21px;}
.ph.is-broken > img{opacity:0;}
.ph.is-broken .ph-fallback{display:flex;}
.ratio-sq{position:relative;padding-top:100%;}
.ratio-43{position:relative;padding-top:75%;}
.ratio-34{position:relative;padding-top:133%;}
.ratio-169{position:relative;padding-top:56.25%;}

/* 空态 / 错误条（X10：解释性文字一律 secondary） */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 16px 26px;}
.empty-ico{width:62px;height:62px;border-radius:var(--radius-circle);background:var(--chip-bg);display:flex;align-items:center;justify-content:center;color:var(--color-text-tertiary);margin-bottom:var(--stack-gap);}

.empty h4{margin:0;font-size:var(--font-size-base);font-weight:500;color:var(--color-text);}
.empty p{margin:5px 0 0;font-size:var(--font-size-sm);line-height:1.55;color:var(--color-text-secondary);}
.empty .btn{margin-top:16px;}
.btn{height:37px;padding:0 20px;border-radius:var(--radius-pill);border:0;cursor:pointer;font-family:inherit;font-size:var(--font-size-sm);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn.primary{height:46px;padding:0 24px;background:var(--color-primary);color:var(--text-on-accent);box-shadow:var(--shadow-brand-sm);}

.btn.primary:active{background:var(--accent-strong);}
.btn i{font-size:15px;}
.errbar{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:var(--radius-md);background:var(--state-error-surface);font-size:var(--font-size-sm);color:var(--color-text-secondary);}
.errbar i{font-size:15px;color:var(--color-danger);}
.errbar .btn-retry{margin-left:auto;background:none;border:0;font-family:inherit;font-size:var(--font-size-sm);color:var(--link-text);cursor:pointer;padding:0;}

.brand-footer{text-align:center;padding:26px 0 20px;}
.brand-footer .rule{display:block;height:1px;background:var(--divider-strong);margin:0 25px 14px;}
.brand-footer .slogan{font-family:var(--font-sans);font-weight:300;font-size:13.5px;letter-spacing:.04em;color:var(--color-text-secondary);margin:0;}
.brand-footer .copy{font-size:var(--font-size-2xs);color:var(--color-text-tertiary);margin:6px 0 0;}

.toast{
  position:absolute;left:50%;bottom:calc(var(--tabbar-h) + var(--home-indicator-h) + 16px);transform:translateX(-50%);
  background:var(--surface-inverse);color:var(--text-inverse);font-size:var(--font-size-sm);padding:9px 15px;border-radius:var(--radius-pill);
  z-index:var(--z-modal);opacity:0;pointer-events:none;transition:opacity var(--duration-base) ease,transform var(--duration-base) ease;max-width:300px;text-align:center;line-height:1.4;
}
.theme-dark .toast{background:#f0ebe4;color:#1a1816;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.overlay{position:absolute;inset:0;background:rgba(0,0,0,.44);z-index:var(--z-modal);display:none;align-items:center;justify-content:center;padding:24px;}
.overlay.show{display:flex;animation:fade var(--duration-base) ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:var(--surface-elevated);border-radius:var(--radius-2xl);padding:18px 16px 12px;text-align:center;}
.theme-dark .sheet{border:1px solid rgba(255,255,255,.05);}
.sheet h4{margin:0 0 8px;font-size:var(--font-size-lg);font-weight:500;color:var(--color-text);}
.sheet p{margin:0;font-size:var(--font-size-sm);line-height:1.6;color:var(--color-text-secondary);}
.sheet .actions{display:flex;gap:8px;margin-top:16px;}
.sheet .actions button{flex:1;height:40px;border-radius:var(--radius-pill);border:0;font-family:inherit;font-size:var(--font-size-base);cursor:pointer;}
.sheet .act-cancel{background:var(--chip-bg);color:var(--color-text);}
.sheet .act-ok{background:var(--color-primary);color:var(--text-on-accent);font-weight:500;}
.sheet .act-danger{background:var(--color-danger-strong);color:var(--on-danger);font-weight:500;}
.asheet{width:100%;border-radius:var(--radius-2xl);overflow:hidden;background:var(--surface-elevated);}
.asheet button{display:block;width:100%;padding:13px 16px;border:0;background:transparent;font-family:inherit;font-size:var(--font-size-base);color:var(--color-text);cursor:pointer;border-bottom:1px solid var(--divider-weak);}
.asheet button:last-child{border-bottom:0;}
.asheet button.danger{color:var(--color-danger);}
.asheet .cancel{background:var(--chip-bg);color:var(--color-text-secondary);font-weight:500;}

/* 产品线 chip（§4.4.1 v1.2）：中性底 + 强文字 + 左侧 8rpx 产品线色竖条 */
.linechip{
  display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 7px 0 4px;
  border-radius:var(--radius-xs);background:var(--chip-bg);color:var(--chip-text-strong);
  font-size:var(--font-size-2xs);font-weight:500;letter-spacing:.02em;white-space:nowrap;
}
.linechip .bar{width:4.2px;height:13px;border-radius:var(--radius-xs);flex:0 0 4.2px;}
.linechip.care .bar{background:var(--color-care);}
.linechip.gear .bar{background:var(--color-gear);}
.linechip.play .bar{background:var(--color-play);}
.linechip.home .bar{background:var(--color-home);}

/* ==========================================================================
   §5.1 HOME
   ========================================================================== */
.search-hairline{
  height:37px;margin:0 var(--gutter);display:flex;align-items:center;gap:6px;
  border-bottom:1px solid var(--divider-weak);cursor:pointer;
}
.search-hairline i{font-size:16.6px;color:var(--color-text-tertiary);}
.search-hairline .ph-text{font-size:var(--font-size-sm);color:var(--color-text-tertiary);}
.search-hairline .act{margin-left:auto;font-size:var(--font-size-xs);color:var(--color-text-secondary);}

.hero{padding:12px var(--gutter) 0;}
.hero-frame{position:relative;border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 5px 14px rgba(46,43,41,.10);}
.theme-dark .hero-frame{box-shadow:0 5px 14px rgba(0,0,0,.55);}
.hero-frame .ph{border-radius:0;}
.hero-ink{position:absolute;inset:0;background:var(--brand-gradient-ink);}
.hero-copy{position:absolute;left:14px;right:14px;bottom:13px;color:var(--text-inverse);}
.hero-title{font-family:var(--font-display);font-size:var(--font-size-2xl);line-height:1.15;color:var(--text-inverse);margin:5px 0 0;letter-spacing:var(--tracking-tight);max-width:92%;}
.hero-sub{font-size:var(--font-size-sm);color:var(--text-muted-inverse);margin:5px 0 0;max-width:88%;line-height:1.4;}
.hero-dots{display:flex;gap:4px;margin:8px 0 0 2px;}
.hero-dots i{width:16.6px;height:2.1px;border-radius:2px;background:rgba(46,43,41,.18);}
.theme-dark .hero-dots i{background:rgba(255,255,255,.22);}
.hero-dots i.on{background:var(--color-primary);}
.hero-fallback{
  position:relative;border-radius:var(--radius-lg);padding-top:56.25%;
  background:var(--brand-gradient-hero);display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.hero-fallback span{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 16px;font-family:var(--font-sans);font-weight:500;font-size:var(--font-size-sm);letter-spacing:var(--tracking-kicker);color:var(--text-on-accent);text-transform:uppercase;line-height:1.7;}

.quick-rail{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--stack-gap);padding:10px var(--gutter) 0;}
.qr-item{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;}
.qr-ico{width:50px;height:50px;border-radius:var(--radius-sm);background:var(--chip-bg);display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);}
.qr-ico i{font-size:22.9px;}
.qr-item.is-primary .qr-ico{background:var(--accent-soft);color:var(--color-primary-dark);}
.qr-item.is-primary .qr-label{color:var(--color-text);font-weight:500;}
.qr-label{font-size:var(--font-size-sm);color:var(--color-text-secondary);letter-spacing:var(--tracking-tight);}

.shelf{padding:var(--section-gap) var(--gutter) 0;}
.shelf-head{display:flex;align-items:flex-end;gap:10px;}
.shelf-title{font-family:var(--font-sans);font-weight:600;font-size:var(--font-size-xl);margin:3px 0 0;line-height:1.3;color:var(--color-text);}
.more{margin-left:auto;display:flex;align-items:center;gap:1px;background:none;border:0;font-family:inherit;font-size:var(--font-size-sm);color:var(--color-text-secondary);cursor:pointer;padding:0 0 2px;}
.more i{font-size:13px;}
/* 首页产品线索引行（4 chip 横滑，pill 样式，与排序 tab 纯文字样式区分） */
.line-index{display:flex;gap:7px;overflow-x:auto;padding:12px 0 2px;white-space:nowrap;position:relative;}
.line-index::-webkit-scrollbar{height:0;}
.line-chip{
  display:inline-flex;align-items:center;gap:5px;height:29px;padding:0 12px 0 8px;border-radius:var(--radius-pill);
  background:var(--chip-bg);color:var(--chip-text-strong);font-family:inherit;font-size:var(--font-size-xs);font-weight:500;
  cursor:pointer;flex:0 0 auto;border:0;
}
.line-chip .bar{width:4.2px;height:15px;border-radius:var(--radius-xs);flex:0 0 4.2px;}
.line-chip.care .bar{background:var(--color-care);}
.line-chip.gear .bar{background:var(--color-gear);}
.line-chip.play .bar{background:var(--color-play);}
.line-chip.home .bar{background:var(--color-home);}
.shelf-tabs{display:flex;gap:20px;height:37px;align-items:center;margin-top:var(--stack-gap);}
.shelf-tab{background:none;border:0;font-family:inherit;font-size:var(--font-size-sm);color:var(--color-text-tertiary);cursor:pointer;padding:6px 0;position:relative;}
.shelf-tab.on{color:var(--color-text);font-weight:600;}
.shelf-tab.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-4px;width:20.8px;height:2.1px;border-radius:2px;background:var(--color-primary);}
.shelf-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--stack-gap);}
.prod-card{cursor:pointer;background:none;border:0;padding:0;text-align:left;font-family:inherit;}
.prod-card .ph{border-radius:var(--radius-md);}
.theme-dark .prod-card .ph{border:1px solid rgba(255,255,255,.06);}
.prod-name{font-size:var(--font-size-sm);font-weight:400;color:var(--color-text);margin:6px 0 0;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prod-desc{font-size:var(--font-size-xs);color:var(--color-text-tertiary);margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prod-price{font-size:var(--font-size-md);font-weight:600;color:var(--color-text);margin:6px 0 0;display:flex;align-items:baseline;gap:1px;}
.prod-price .cur{font-size:var(--font-size-xs);font-weight:400;}
.prod-price s{font-size:var(--font-size-xs);font-weight:400;color:var(--color-text-tertiary);margin-left:5px;}
.prod-rate{font-size:var(--font-size-xs);color:var(--color-text-secondary);display:flex;align-items:center;gap:3px;margin:3px 0 0;}
.prod-rate i{font-size:11.4px;color:var(--color-warning);}
.prod-rate .cnt{color:var(--color-text-tertiary);}

/* ==========================================================================
   §5.2 COMMUNITY
   ========================================================================== */
.masthead{display:flex;align-items:center;}
.mast-title{font-family:var(--font-sans);font-weight:600;font-size:var(--font-size-xl);margin:0;line-height:1.2;color:var(--color-text);}
.masthead .kicker{margin-top:2px;}
.issue-nav{display:flex;background:var(--color-surface-veil-95);border-bottom:1px solid var(--divider-weak);position:sticky;top:50px;z-index:19;}
.issue-tab{flex:1;background:none;border:0;font-family:inherit;font-size:var(--font-size-base);color:var(--color-text-tertiary);height:50px;cursor:pointer;position:relative;font-weight:400;}
.issue-tab.on{color:var(--color-text);font-weight:600;}
.issue-tab.on::after{content:"";position:absolute;left:12.5px;right:12.5px;bottom:0;height:1.6px;border-radius:2px;background:var(--color-primary);}
/* 话题栏：仅话题 tab；右缘渐隐遮罩（§5.2.2③ v1.4）+ pointer-events:none */
.topic-rail{display:flex;gap:6px;overflow-x:auto;padding:10px var(--gutter);white-space:nowrap;position:relative;}
.topic-rail::-webkit-scrollbar{height:0;}
.topic-rail::after{
  content:"";position:absolute;right:0;top:0;bottom:0;width:25px;pointer-events:none;z-index:1;
  background:linear-gradient(90deg,rgba(246,242,238,0),var(--color-background) 100%);
}
.theme-dark .topic-rail::after{background:linear-gradient(90deg,rgba(26,24,22,0),var(--color-background) 100%);}
.topic-chip{
  display:inline-flex;align-items:center;gap:5px;height:29px;padding:0 12px;border-radius:var(--radius-pill);border:0;
  background:var(--chip-bg);color:var(--chip-text);font-family:inherit;font-size:var(--font-size-xs);cursor:pointer;flex:0 0 auto;
}
.topic-chip .cnt{color:var(--color-text-tertiary);font-size:var(--font-size-2xs);}
.topic-chip.on{background:var(--chip-accent-bg);color:var(--chip-accent-text);font-weight:500;}
.topic-chip.on .cnt{color:var(--chip-accent-text);opacity:.75;}
/* 发现入口形态（推荐 tab）：chip + 右箭头，表示「去独立话题页」 */
.topic-chip.entry .go{font-size:12px;opacity:.6;}
/* 话题 tab 默认态：chip 选择器网格（Phase 1 §5.2.2③ / Phase 2 T2） */
.topic-selector{padding:6px var(--gutter) 0;}
.topic-sel-head{text-align:center;padding:16px 8px 18px;}
.topic-sel-head h4{font-family:var(--font-sans);font-weight:600;font-size:var(--font-size-lg);margin:5px 0 0;color:var(--color-text);}
.topic-sel-head p{font-size:var(--font-size-sm);color:var(--color-text-secondary);margin:5px 0 0;line-height:1.55;}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.topic-grid .topic-chip{height:33px;justify-content:flex-start;}
/* 选中后：选择器收起为顶部一行已选 chip（Phase 2 §8 #35） */
.topic-selected{display:flex;gap:6px;padding:10px var(--gutter) 2px;align-items:center;}
.topic-selected .topic-chip.on{height:29px;}
.topic-selected .topic-chip i{font-size:11px;margin-left:2px;}

.lead-post{padding:var(--stack-gap) var(--gutter) 0;}
.post-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.avatar{width:33px;height:33px;border-radius:50%;background:var(--chip-bg);color:var(--color-text-secondary);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;overflow:hidden;flex:0 0 auto;cursor:pointer;border:0;font-family:inherit;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar.sm{width:26px;height:26px;font-size:12px;}
.post-user{display:flex;flex-direction:column;min-width:0;gap:1px;}
.post-user .nm{font-size:var(--font-size-sm);font-weight:500;color:var(--color-text);}
.post-user .tm{font-size:var(--font-size-xs);color:var(--color-text-tertiary);}
.post-more{margin-left:auto;background:none;border:0;color:var(--color-text-tertiary);cursor:pointer;padding:4px;}
.post-more i{font-size:16.6px;}
.lead-post .ph{border-radius:var(--radius-lg);}
.theme-dark .lead-post .ph,.theme-dark .feed-post .ph{border:1px solid rgba(255,255,255,.06);}
.lead-body{font-size:var(--font-size-md);font-weight:400;line-height:1.7;color:var(--color-text);margin:8px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.post-actions{display:flex;align-items:center;gap:16px;margin-top:8px;}
.pa{display:flex;align-items:center;gap:4px;background:none;border:0;font-family:inherit;font-size:var(--font-size-xs);color:var(--color-text-tertiary);cursor:pointer;padding:0;}
.pa i{font-size:15px;}
.pa.on{color:var(--color-text-secondary);}
.pa.on i{color:var(--color-danger);}
.pa .n{font-weight:400;}

.feed{padding:0 var(--gutter);}
.feed-post{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--divider-weak);}
.feed-post .ph{width:100px;flex:0 0 100px;border-radius:var(--radius-md);}
.theme-dark .feed-post{background:var(--surface-elevated);border-radius:var(--radius-lg);border-bottom:0;padding:12px;margin-bottom:10px;}
.theme-dark .feed-post .ph{border:1px solid rgba(255,255,255,.06);}
.feed-main{min-width:0;flex:1;}
.feed-body{font-size:var(--font-size-base);font-weight:400;line-height:1.6;color:var(--color-text);margin:5px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.feed-post .post-actions{margin-top:6px;gap:14px;}
.end-note{text-align:center;font-size:var(--font-size-xs);color:var(--color-text-tertiary);padding:18px 0 6px;}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:8px;}
.grid9 .ph,.grid9 .ph > img{border-radius:2px;}

.fab{
  position:absolute;right:var(--gutter);bottom:calc(var(--tabbar-h) + var(--home-indicator-h) + 14px);
  width:54px;height:54px;border-radius:50%;border:0;background:var(--color-primary);color:var(--text-on-accent);
  box-shadow:var(--shadow-brand);cursor:pointer;display:none;align-items:center;justify-content:center;z-index:var(--z-fab);
}
.fab.show{display:flex;}
.fab i{font-size:22.9px;}

/* ==========================================================================
   §5.3 MESSAGES（Phase 2 §2.4.4 两段式 Tab）
   ========================================================================== */
.inbox{margin:12px var(--gutter) 0;background:var(--surface-elevated);border-radius:var(--radius-lg);overflow:hidden;}

}

.nr-item.is-primary .nr-ico{background:var(--accent-soft);color:var(--color-primary-dark);}

.filter-chip{flex:0 0 auto;height:27px;padding:0 12px;border-radius:var(--radius-pill);border:0;background:var(--chip-bg);color:var(--chip-text);font-family:inherit;font-size:var(--font-size-xs);cursor:pointer;}

      '<h4>' + title + '</h4><p>' + sub + '</p>' +
      (btnLabel ? '<button class="btn ' + (act === 'primary' ? 'primary' : 'ghost') + '" data-act="' + (act === 'primary' ? 'primary-cta' : 'ghost-cta') + '">' + btnLabel + '</button>' : '') +
      '</div>';

      '</div></header>';

    html += '<nav class="issue-nav">' + tabs.map(function(t,i){
      return '<button class="issue-tab ' + (i===S.sub.communityTab?'on':'') + '" data-act="community-tab" data-i="' + i + '">' + t + '</button>';
    }).join('') + '</nav>';

    /* 搜索条：三个 tab 都有（Phase 2 #23） */
    html += '<div class="search-hairline" data-act="toast" data-msg="搜索帖子、用户、话题…">' +
      '<i class="luc luc-search"></i><span class="ph-text">搜索帖子、用户、话题…</span></div>';

    /* Topic Rail 双重定位（Phase 1 §5.2.2③ v1.5 / Phase 2 §8 #23）：
       推荐 tab = 发现入口（点 chip → 跳独立话题页）；话题 tab = 筛选器（点 chip → 就地过滤 feed） */
    if (S.sub.communityTab === 0 && state !== 'loading') {
      html += '<div class="topic-rail">' + TOPICS.map(function(t,i){
        return '<button class="topic-chip entry" data-act="topic-entry" data-i="' + i + '">' +
          t.name + '<span class="cnt">' + t.cnt + '</span><i class="luc luc-chevron-right go"></i></button>';
      }).join('') + '</div>';
    }

    if (state === 'loading') {
      html += '<section class="lead-post">';
      for (var i = 0; i < 3; i++) {
        html += '<div style="margin-bottom:22px">' +
          '<div class="post-head"><div class="avatar sm sk" style="width:33px;height:33px"></div>' +
          '<div style="flex:1">' + sk('42%','10px') + sk('28%','9px','margin-top:6px') + '</div></div>' +
          '<div class="ph ratio-43"><div class="sk fill"></div></div></div>';

      html += '<div class="lead-post">' + errBar('内容加载失败') + '</div>';

      html += emptyState('luc-sparkles', '这里还很安静', '发布第一条，让别人听见你的宠物故事', '发布第一条', 'primary');

    } else if (S.sub.communityTab === 2 && S.sub.topic < 0) {
      /* 话题 tab 默认态 = 未选话题 → 选择器态（不是空态三件套，Phase 2 T2 / §8 #34） */
      html += '<div class="topic-selector"><div class="topic-sel-head">' +
        '<div class="kicker">TOPIC</div>' +

            t.name + '<span class="cnt">' + t.cnt + '</span></button>';
        }).join('') + '</div></div>';
    } else {
      if (S.sub.communityTab === 2) {
        /* 选择器收起 → 顶部一行已选 chip（可清除） */

          '<button class="pa" data-act="toast" data-msg="' + LEAD.comments + ' 条评论"><i class="luc luc-message-circle"></i><span class="n">' + LEAD.comments + '</span></button>' +

          '</div></article>';

      var posts = S.sub.communityTab === 0 ? FEED
                : S.sub.communityTab === 1 ? FOLLOW_FEED
                : (TOPIC_FEED[S.sub.topic] || []);
      html += '<section class="feed">';

        html += '<article class="feed-post" data-act="post" data-name="' + f.user + '">' +
          '<div class="ph ratio-34" style="width:100px;flex:0 0 100px;border-radius:var(--radius-md)">' + imgTag(f.img, f.user) +
          '<span class="ph-fallback"><i class="luc luc-image"></i></span></div>' +
          '<div class="feed-main">' +
          '<div class="post-head" style="margin-bottom:0">' +
          '<button class="avatar sm" data-act="author" data-name="' + f.user + '">' + f.user.slice(0,1) + '</button>' +
          '<div class="post-user"><span class="nm" style="font-size:var(--font-size-sm)">' + f.user + '</span>' +
          '<span class="tm">' + f.time + '</span></div>' +
          '</div>' +
          lineChip(f.line) +
          '<p class="feed-body">' + f.body + '</p>' +
          (f.grid9 ? '<div class="grid9">' + f.grid9.map(function(g){
            return '<div class="ph ratio-sq" style="border-radius:2px">' + imgTag(g, '') + '</div>';
          }).join('') + '</div>' : '') +
          '<div class="post-actions">' +
          '<button class="pa ' + (S.liked['f'+idx] ? 'on' : '') + '" data-act="like" data-k="f'+idx + '"><i class="luc luc-heart"></i><span class="n">' + (f.likes + (S.liked['f'+idx] ? 1 : 0)) + '</span></button>' +
          '<button class="pa" data-act="toast" data-msg="' + f.comments + ' 条评论"><i class="luc luc-message-circle"></i><span class="n">' + f.comments + '</span></button>' +
          '</div></div></article>';
      });
      html += '</section>';
      html += '<div class="end-note">— 已经到底了 —</div>';
    }

    html += '<div style="height:72px"></div>';
    return html;
  }

    html += '<div class="inbox">';
    html += '<nav class="msg-seg">' +
      '<button class="msg-seg-tab ' + (S.sub.msgSeg===0?'on':'') + '" data-act="msg-seg" data-i="0">私信' +
      (S.unreadDm > 0 ? '<span class="msg-seg-badge">' + S.unreadDm + '</span>' : '') + '</button>' +
      '<button class="msg-seg-tab ' + (S.sub.msgSeg===1?'on':'') + '" data-act="msg-seg" data-i="1">通知</button>' +

    if (S.sub.msgSeg === 1) {
      if (state === 'login') {
        html += emptyState('luc-user', '登录后查看通知', '订单状态、互动提醒会在这里汇总', '去登录', 'primary');
      } else if (state === 'loading') {
        html += '<div class="notice-row">' + [0,1,2,3].map(function(){
          return '<div style="display:flex;flex-direction:column;align-items:center;gap:5px">' +
            sk('29px','29px','border-radius:var(--radius-sm)') + sk('38px','9px') + '</div>';
        }).join('') + '</div>';
      } else {
        var notices = [
          {i:'luc-inbox', l:'全部通知'}, {i:'luc-sparkles', l:'互动通知'},
          {i:'luc-package', l:'订单通知'}, {i:'luc-bell', l:'系统通知'}
        ];
        html += '<div class="notice-row">' + notices.map(function(n, i){
          return '<button class="nr-item ' + (i === S.sub.notifFilter ? 'is-primary' : '') + '" data-act="notif-filter" data-i="' + i + '">' +
            '<span class="nr-ico"><i class="luc ' + n.i + '"></i>' + (i === S.sub.notifFilter ? '<span class="dot"></span>' : '') + '</span>' +
            '<span class="nr-label">' + n.l + '</span></button>';
        }).join('') + '</div>';
        html += '<div class="filter-row">' + ['全部','互动','订单','系统'].map(function(f,i){
          return '<button class="filter-chip ' + (i===S.sub.notifFilter?'on':'') + '" data-act="notif-filter" data-i="' + i + '">' + f + '</button>';

            '<span class="ni-time">' + n.time + '</span></div>';

        html += emptyState('luc-message-square', '登录后查看消息', '登录后可接收私信与订单通知', '去登录', 'primary');

        if (state === 'loading') {

    html += '</div>';

  function convRow(c) {
    var av = c.avatar.indexOf('icon:') === 0 ? '<i class="luc luc-' + c.avatar.slice(5) + '"></i>' : c.avatar;
    return '<div class="conv-row ' + (c.unreadRow ? 'unread' : '') + '" data-conv data-name="' + c.name + '">' +

      '<div class="conv-body" data-conv-body>' +
      (c.unreadRow ? '<span class="conv-unread-bar"></span>' : '') +
      '<div class="conv-avatar">' + av + '</div>' +
      '<div class="conv-main">' +
      '<div class="conv-title">' +
      (c.pinned && S.pinned ? '<i class="luc luc-bookmark pin"></i>' : '') +
      '<span class="nm">' + c.name + '</span>' +
      (c.unread ? '<span class="cnt">' + c.unread + '</span>' : '') +
      '</div>' +
      '<p class="conv-sum">' + c.sum + '</p>' +

    } else if (state === 'vipError') {

        '<div class="vip-prog-num">1,240 / 8,000</div>' +

    if (state === 'login') {

        return '<div class="band-item" role="button" tabindex="0" data-act="toast" data-msg="' + w.l + '">' +

            : '<div class="num">' + w.n + '</div>') +
          '<div class="lb">' + w.l + '</div></div>';
      }).join('') + '</div>';

      html += '<div class="band social-band">' + USER_SOCIAL.map(function(s){
        return '<div class="band-item" role="button" tabindex="0" data-act="toast" data-msg="' + s.l + '">' +
          (state === 'loading' ? '<div class="sk" style="width:20px;height:16px;margin:0 auto"></div>'
            : '<i class="luc ' + s.i + '"></i>') +
          (state === 'loading' ? '<div class="sk" style="width:26px;height:14px;margin:5px auto 0"></div>'

          '<div class="lb">' + s.l + '</div></div>';

  /* ==========================================================================
     渲染调度
     ========================================================================== */
  function renderPage(key) {
    var el = document.getElementById('page-' + key);
    var state = S.states[key];
    if (key === 'pet') el.innerHTML = renderPet(state);
    else if (key === 'home') el.innerHTML = renderHome(state);
    else if (key === 'community') el.innerHTML = renderCommunity(state);
    else if (key === 'messages') el.innerHTML = renderMessages(state);
    else if (key === 'user') el.innerHTML = renderUser(state);
  }

  function renderTabbar() {
    document.getElementById('tabbar').innerHTML = TABS.map(function(t){
      var badge = (t.key === 'messages' && S.unreadDm > 0)
        ? '<span class="tb-badge">' + (S.unreadDm > 99 ? '99+' : S.unreadDm) + '</span>' : '';
      return '<button class="tb-item" data-page="' + t.key + '"><i class="luc ' + t.icon + '"></i><span>' + t.name + '</span>' + badge + '</button>';
    }).join('');
  }

  function applyActive() {
    TABS.forEach(function(t){
      document.getElementById('page-' + t.key).classList.toggle('is-active', t.key === S.page);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.pb-tabs button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-page') === S.page);
    });
    document.getElementById('fab').classList.toggle('show', S.page === 'community');
    document.getElementById('specSub').textContent = S.specAll ? '全部页面' : S.page;
    renderSpec();
  }

  function goPage(key) {
    if (['pet','home','community','messages','user'].indexOf(key) < 0) return;
    S.page = key;
    renderPage(key);
    renderTabbar();
    applyActive();
    syncStateSelect();
  }

  function buildChrome() {
    document.getElementById('pbTabs').innerHTML = TABS.map(function(t){
      return '<button data-page="' + t.key + '"><i class="luc ' + t.icon + '"></i>' + t.name + '</button>';
    }).join('');
    renderTabbar();
  }

  function syncStateSelect() {
    document.getElementById('pbState').innerHTML = STATES[S.page].map(function(s){
      return '<option value="' + s.v + '" ' + (S.states[S.page] === s.v ? 'selected' : '') + '>' + s.t + '</option>';
    }).join('');
  }

  function setTheme(t) {
    S.theme = t;
    document.documentElement.classList.toggle('theme-dark', t === 'dark');
    document.documentElement.classList.toggle('theme-light', t === 'light');
    Array.prototype.forEach.call(document.querySelectorAll('#pbTheme button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-theme') === t);
    });
  }

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1700);
  }

  var overlay = document.getElementById('overlay');
  function closeOverlay() { overlay.classList.remove('show'); overlay.innerHTML = ''; }
  function showModal(opts) {
    overlay.innerHTML = '<div class="sheet"><h4>' + opts.title + '</h4><p>' + opts.content + '</p>' +
      '<div class="actions">' +
      '<button class="act-cancel" data-act="overlay-close">' + (opts.cancelText || '取消') + '</button>' +
      '<button class="' + (opts.danger ? 'act-danger' : 'act-ok') + '" data-act="overlay-ok">' + (opts.okText || '确定') + '</button>' +
      '</div></div>';
    overlay.classList.add('show');
    overlay.setAttribute('data-mode', 'modal');
    overlay.setAttribute('data-msg', opts.okMsg || '');
  }
  function showActionSheet(items) {
    overlay.innerHTML = '<div class="asheet">' +
      items.map(function(it,i){ return '<button class="' + (it.danger ? 'danger' : '') + '" data-act="sheet-item" data-i="' + i + '">' + it.label + '</button>'; }).join('') +
      '<button class="cancel" data-act="overlay-close">取消</button></div>';
    overlay.classList.add('show');
    overlay.setAttribute('data-mode', 'sheet');
    overlay.setAttribute('data-items', JSON.stringify(items));
  }

    var list = S.specAll ? SPEC : SPEC.filter(function(s){ return s.page === S.page; });

      var roleCls = /主角/.test(s.role) ? 'hero' : '';
      return '<div class="spec-card">' +
        '<h4>' + s.block + '<span class="role ' + roleCls + '">' + s.role + '</span></h4>' +
        '<dl>' +
        '<dt>关键规格</dt><dd>' + s.spec + '</dd>' +
        '<dt>视觉主角</dt><dd>' + s.role + '</dd>' +
        '<dt>真实实现</dt><dd><span class="warn">' + s.impl + '</span></dd>' +
        '<dt>状态态</dt><dd>' + s.states + '</dd>' +
        '<dt>深浅差异</dt><dd>' + s.dark + '</dd>' +
        '<dt>数据依赖</dt><dd>' + (s.data || '可用 · 无后端依赖') + '</dd>' +
        '</dl></div>';
    }).join('');
    document.getElementById('specFilter').innerHTML =
      '<button data-scope="page" class="' + (S.specAll ? '' : 'on') + '">当前页</button>' +
      '<button data-scope="all" class="' + (S.specAll ? 'on' : '') + '">全部页面</button>';
  }

  /* ==========================================================================
     事件
     ========================================================================== */
  function onClick(e) {
    var pageBtn = e.target.closest && e.target.closest('[data-page]');
    if (pageBtn) { goPage(pageBtn.getAttribute('data-page')); return; }
    var themeBtn = e.target.closest && e.target.closest('[data-theme]');
    if (themeBtn) { setTheme(themeBtn.getAttribute('data-theme')); return; }

    var el = e.target.closest && e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var msg = el.getAttribute('data-msg');

    switch (act) {
      case 'toast': toast(msg || 'OK'); break;
      case 'home-tab': S.sub.homeTab = +el.getAttribute('data-i'); renderPage('home'); break;
      case 'community-tab':
        S.sub.communityTab = +el.getAttribute('data-i'); S.sub.topic = -1; renderPage('community'); break;
      case 'topic':
        S.sub.topic = (S.sub.topic === +el.getAttribute('data-i')) ? -1 : +el.getAttribute('data-i');
        renderPage('community'); break;
      case 'topic-entry':
        toast('跳转独立话题页 /pages/user/community-topic?topic=' + TOPICS[+el.getAttribute('data-i')].name);
        break;
      case 'topic-clear':
        S.sub.topic = -1; renderPage('community'); break;
      case 'notif-filter':
        S.sub.notifFilter = +el.getAttribute('data-i'); S.sub.msgSeg = 1; renderPage('messages'); break;
      case 'msg-seg': S.sub.msgSeg = +el.getAttribute('data-i'); renderPage('messages'); break;
      case 'pet': S.sub.pet = +el.getAttribute('data-i'); renderPage('pet'); break;
      case 'like':
        if (S.states.community === 'login') {
          showModal({ title:'登录后即可点赞', content:'登录后即可点赞', okText:'去登录', cancelText:'再看看', okMsg:'跳转登录页（带 ?redirect=community）' });
          break;
        }
        var k = el.getAttribute('data-k');
        S.liked[k] = !S.liked[k];
        renderPage('community');
        break;
      case 'retry': toast('正在重试…'); break;
      case 'ghost-cta': toast('进入分类页 · 全部分类'); break;
      case 'primary-cta': toast('进入发布页'); break;
      case 'author': toast('进入作者主页：' + (msg || '')); break;
      case 'post': toast('进入帖子详情'); break;
      case 'post-more':
        showActionSheet([{ label:'举报', danger:true }, { label:'不感兴趣' }, { label:'删除', danger:true }]);
        break;
      case 'login':
        showModal({ title:'登录', content:'登录后享受更多会员权益', okText:'去登录', cancelText:'稍后再说', okMsg:'跳转登录页（带 ?redirect=）' }); break;
      case 'need-login':
        /* Phase 1 §5.4.2⑥ / Phase 2 v1.5 §9.1 O8 呈现形式裁定：
           功能清单不加锁图标，改为按需拦截。
           文案统一「登录后即可查看{该功能}」——让用户知道点对了、只是需要登录，而不是被拒绝。 */
        showModal({ title:'登录后即可查看', content:'登录后即可查看「' + (msg || '该功能') + '」', okText:'去登录', cancelText:'再看看', okMsg:'跳转登录页（带 ?redirect=）' });
        break;
      case 'action-sheet':
        if (S.states.community === 'login') {
          showModal({ title:'登录后即可发布', content:'登录后即可发布，登录成功会回到本页并保留草稿', okText:'去登录', cancelText:'再看看', okMsg:'跳转登录页（带 ?redirect=community）' });
          break;
        }
        showActionSheet([{ label:'举报', danger:true }, { label:'不感兴趣' }, { label:'复制链接' }]);
        break;
      case 'delete-conv':
        showModal({ title:'删除会话', content:'删除后会话会从列表移除，收到新消息后会重新出现。', okText:'删除', cancelText:'取消', danger:true, okMsg:'已删除' });
        break;
      case 'overlay-close': closeOverlay(); break;
      case 'overlay-ok': {
        var m = overlay.getAttribute('data-msg') || '已确认';
        if (m === '已删除') { S.deleted = true; S.unreadDm = Math.max(0, S.unreadDm - 1); renderPage('messages'); renderTabbar(); }
        closeOverlay(); toast(m); break;
      }
      case 'sheet-item': {
        var items = JSON.parse(overlay.getAttribute('data-items') || '[]');
        var it = items[+el.getAttribute('data-i')];
        var label = it ? it.label : '';
        closeOverlay();
        if (label === '举报') {
          showActionSheet([{ label:'骚扰辱骂' }, { label:'广告营销' }, { label:'其他' }]);
        } else if (label === '删除') {
          showModal({ title:'删除这条帖子？', content:'删除后无法恢复，确定删除这条帖子吗？', okText:'删除', cancelText:'取消', danger:true, okMsg:'已删除' });
        } else {
          toast(label);
        }
        break;
      }
    }
  }

  function onStateChange() {
    S.states[S.page] = document.getElementById('pbState').value;
    if (S.page === 'messages') {
      S.unreadDm = (S.states.messages === 'empty' || S.states.messages === 'login') ? 0 : 2;
      renderTabbar();
    }
    renderPage(S.page);
  }

  /* ---------- 消息页：左滑删除 + 长按 Action Sheet ---------- */
  function bindSwipe() {
    var startX = 0, startY = 0, cur = null;
    var msgPage = document.getElementById('page-messages');
    var lpTimer = null;

    msgPage.addEventListener('touchstart', function(e){
      var body = e.target.closest('[data-conv-body]');
      if (!body) return;
      cur = body; startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      clearTimeout(lpTimer);
      lpTimer = setTimeout(function(){
        showActionSheet([{ label:'置顶会话' }, { label:'删除会话', danger:true }]);
        cur = null;
      }, 350);
    }, { passive:true });
    msgPage.addEventListener('touchmove', function(e){
      if (!cur) return;
      var dx = e.touches[0].clientX - startX;
      var dy = e.touches[0].clientY - startY;
      if (Math.abs(dx) < 6 && Math.abs(dy) > Math.abs(dx)) { cur = null; clearTimeout(lpTimer); return; }
      clearTimeout(lpTimer);
      cur.style.transform = 'translateX(' + Math.min(0, Math.max(-68, dx)) + 'px)';
    }, { passive:true });
    document.addEventListener('touchend', function(){
      clearTimeout(lpTimer);
      if (!cur) return;
      var mm = cur.style.transform.match(/-?[\d.]+/);
      var off = mm ? parseFloat(mm[0]) : 0;
      cur.style.transform = off < -34 ? 'translateX(-68px)' : 'translateX(0)';
      cur = null;
    });

    var mDown = false, mStart = 0, mBody = null;
    msgPage.addEventListener('mousedown', function(e){
      var body = e.target.closest('[data-conv-body]');
      if (!body || e.target.closest('[data-act]')) return;
      mDown = true; mStart = e.clientX; mBody = body; e.preventDefault();
    });
    document.addEventListener('mousemove', function(e){
      if (!mDown) return;
      var dx = e.clientX - mStart;
      mBody.style.transform = 'translateX(' + Math.min(0, Math.max(-68, dx)) + 'px)';
    });
    document.addEventListener('mouseup', function(){
      if (!mDown) return;
      mDown = false;
      if (!mBody) return;
      var mm = mBody.style.transform.match(/-?[\d.]+/);
      var off = mm ? parseFloat(mm[0]) : 0;
      mBody.style.transform = off < -34 ? 'translateX(-68px)' : 'translateX(0)';
      mBody = null;
    });
  }

  document.addEventListener('error', function(e){
    var t = e.target;
    if (t && t.tagName === 'IMG' && t.parentNode) { t.parentNode.classList.add('is-broken'); t.remove(); }
  }, true);

  /* ==========================================================================
     启动
     ========================================================================== */
  function boot() {
    buildChrome();
    ['pet','home','community','messages','user'].forEach(renderPage);
    syncStateSelect();
    setTheme('light');
    bindSwipe();

    document.addEventListener('click', onClick);
    document.getElementById('pbState').addEventListener('change', onStateChange);
    document.getElementById('pbSpec').addEventListener('click', function(){
      document.getElementById('spec').classList.toggle('is-collapsed');
      this.classList.toggle('accent');
    });
    document.getElementById('pbShot').addEventListener('click', function(){ toast('用 Playwright 截图请见 _shots/ 目录'); });
    document.getElementById('specFilter').addEventListener('click', function(e){
      var b = e.target.closest('button[data-scope]');
      if (!b) return;
      S.specAll = b.getAttribute('data-scope') === 'all';
      renderSpec();
    });
    document.getElementById('overlay').addEventListener('click', function(e){ if (e.target === this) closeOverlay(); });

    goPage('home');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
